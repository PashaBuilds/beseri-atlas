# Çürütücü itirazlarına verilen kararlar (Geçiş 3, §10)
#
# Çürütücü oturum itirazı üretir; üretici oturum ya DÜZELTİR ya da GEREKÇELENDİRİR.
# Cevapsız bırakmak yasaktır — "şimdilik böyle kalsın" notu §15'te açıkça yasak.
#
# karar: duzeltildi | gerekcelendirildi | yanlis-pozitif
#
# Faz 0 turu: 2026-08-20

kararlar:
  - tip: tek-kaynakli-nedensellik
    kapsam: genel
    karar: gerekcelendirildi
    gerekce: >-
      İtirazların büyük çoğunluğu, bir referans eserin KENDİ ifadesini aktaran ve
      o esere açıkça atfedilen cümlelerde tetikleniyor ("TDV İslâm Ansiklopedisi
      … belirtir", "Stanford Felsefe Ansiklopedisi'nin özetlediği biçimiyle").
      Böyle bir cümlede iddia "X olduğu için Y oldu" değil, "K kaynağı şunu
      söylüyor"dur; ikinci kaynak eklemek iddiayı güçlendirmez, farklı bir iddia
      yapar. §10'un hedeflediği zayıflık — tek dipnotla ayakta duran bağımsız bir
      nedensellik yargısı — bu on makalede bulunmadı.
    istisna_incelendi:
      - donem-13 "muharip ölümleri" paragrafı: kapsam sınırı zaten metinde açıkça
        beyan ediliyor, ek kaynak gerekmiyor.
      - kavram-demografik-gecis "eşzamanlı olmayan zamanlama": model tanımı,
        kaynağın kendi formülasyonu.

  - tip: ustunluk-iddiasi
    kapsam: genel
    karar: kismen-duzeltildi
    gerekce: >-
      İki gerçek zayıflık bulundu ve düzeltildi: dusunur-ibn-haldun ve
      kavram-asabiyet dosyalarındaki "ilk defa ilmî ve nesnel yöntemle inceleyen
      düşünür" iddiası, kaynağa atfedilmeden düz cümle olarak kuruluyordu; her iki
      yerde de açık atıf çerçevesine ("TDV İslâm Ansiklopedisi'ne göre") alındı.
      Kalan tetiklenmeler Türkçedeki "ilk" kelimesinin sıra sayısı olarak
      kullanımından kaynaklanıyor ("ilk üç yüz yıl", "kuruluş yıllarında ilk
      düzenli birlikler") ve üstünlük iddiası değil.

  - tip: kapsam-carpitmasi
    kapsam: genel
    karar: yanlis-pozitif
    gerekce: >-
      Üç tetiklenmenin üçü de özel ad kullanımıydı: "Birinci Dünya Savaşı",
      "evrensel tarih" (Kitâbü'l-İber'in türü) ve "İngilizce dünyada" (dil
      coğrafyası). Dedektör bu kalıpları hariç tutacak biçimde daraltıldı;
      küresel dil kullanan bölgesel iddia arayışı korundu.

  - tip: anakronizm
    kapsam: genel
    karar: tetiklenmedi
    gerekce: >-
      On makalenin hiçbirinde, kavramın doğduğu tarihten önce biten bir dönemde
      o kavramın kullanımı bulunmadı.

  - tip: kesinlik-dili
    kapsam: genel
    karar: tetiklenmedi
    gerekce: >-
      Atıf çerçevesi olmadan kullanılan kesinlik ifadesi bulunmadı.

# Çürütücünün kendisinin bulduğu ve hatta düzelttirdiği kusur
hat_duzeltmesi:
  - bulgu: >-
      Çürütücü geçişi sırasında donem-13 girişindeki "dört büyük imparatorluk
      dağıldı" cümlesinin dipnotsuz geçtiği görüldü. KAPI 2 yalnızca rakamla
      yazılmış sayıları arıyordu; yazıyla yazılmış nicelikler gözden kaçıyordu.
    aksiyon: >-
      araclar/linter-dipnot.mjs'e YAZIYLA_SAYI dedektörü eklendi. Kapı
      sıkılaştırıldı; iki makalede kaynaksız nicelik iddiası bulundu ve
      düzeltildi.

# Faz 2 turu B09: MO aktor kumesi — 2026-08-21
  - tip: ustunluk-iddiasi
    kapsam: "aktor-sumer-sehir-devletleri, aktor-misir-yeni-kralligi, aktor-hitit-imparatorlugu, aktor-ahamenis-imparatorlugu, aktor-roma-imparatorlugu"
    karar: yanlis-pozitif
    gerekce: >-
      Kalan itirazlarin tamami "tek" kelimesinin ustunluk anlaminda DEGIL sayi
      anlaminda kullanildigi cumlelerde tetikleniyor: "tek kisi yonetimi",
      "tek bir tarih degildir", "tek basina bir dilbilim ayrintisi degildir",
      "tek bir hukuk duzeni", "tek sorun degildi". Bunlar bir onculuk ya da
      ustunluk iddiasi tasimiyor; aksine bircogu OLUMSUZ cumlelerdir. Kalan iki
      ornek ("en eski yazili Hint-Avrupa dili", "tarihteki ilk tektanricilik")
      ise kaynaga acikca atfedilerek yazildi ("Kaynak bu dili … olarak
      tanimlar", "kaynagin ifadesine gore … siklikla yorumlanir"), yani
      itirazin istedigi atif cercevesi metinde zaten var. Dedektor kelime
      duzeyinde calistigi icin bu ayrimi goremiyor; kapinin gevsetilmesi degil
      kararin kayda gecirilmesi dogru cozumdur.
  - bulgu: >-
      Cürütücü, alti makalenin "Olcek" bolumunde dunya nufusu ile aktorun
      hakimiyet alani arasinda kurulan orani kapsam-carpitmasi olarak isaretledi.
      Itiraz hakliydi: kaynaklarda aktorlerin kendi nufuslarina dair olcum yok,
      dolayisiyla "nufusun kayda deger bir bolumunu kapsiyordu" turu cumleler
      kaynaksiz cikarimdi.
    aksiyon: >-
      Alti makalenin Olcek bolumu yeniden yazildi; oran iddiasi kaldirildi ve
      yerine iki serinin neden karsilastirilamadigi acikca yazildi. Ayrica
      aktor-asur-imparatorlugu'nda "tartismasiz" nitelemesi kaynaga atfedildi.
  - bulgu: >-
      Curutucu, aktor-han-imparatorlugu'nun kapsam sinirinda gecen "devlet
      ideolojisi" ifadesini YUKSEK ciddiyette anakronizm olarak isaretledi:
      "ideoloji" kavrami yaklasik 1790'dan itibaren kullaniliyor, makale ise
      220'de bitiyor.
    aksiyon: >-
      Ifade "resmi ogretisi" ile degistirildi. Makalenin govdesinde hanedan
      degisiminin kozmolojik dille mesrulastirilmasi zaten kaynagin kendi
      terimiyle ("Goksel Yetki") anlatiliyordu; kapsam cumlesi de ayni dile
      cekildi.
  - tip: ustunluk-iddiasi
    kapsam: "faz-2 B10 kumesi"
    karar: yanlis-pozitif
    gerekce: >-
      B09'daki ayni gerekce gecerli: kalan itirazlar "tek" kelimesinin sayi
      anlaminda kullanildigi cumlelerde ("tek bir siyasi birimi anlatmaz",
      "tek renkli bir harita", "tek bir statik harita") tetikleniyor. Bunlar
      onculuk iddiasi degil, coguldan ayirt etme ifadeleridir.

# Faz 2 turu B11: klasik/gec antik olay kumesi — 2026-08-21
  - bulgu: >-
      Curutucu, olay-islam-fetihleri'nde "jeopolitik" kavramini iki kez YUKSEK
      ciddiyette anakronizm olarak isaretledi (kavram ~1900'den itibaren
      kullaniliyor, makale 742'de bitiyor); ayrica "tamamen" ifadesini atif
      cercevesi olmadan kullanilmis kesinlik dili saydi.
    aksiyon: >-
      "jeopolitik" -> "siyasi", "tamamen" -> "butunuyle" olarak degistirildi ve
      cumle "kaynaga gore" ile acikca kaynaga atfedildi. Iddianin icerigi
      degismedi; yalnizca donemin diline ve atif zorunluluguna uyduruldu.
  - tip: ustunluk-iddiasi
    kapsam: "faz-2 B11 kumesi"
    karar: yanlis-pozitif
    gerekce: >-
      B09 ve B10'daki ayni gerekce: kalan dusuk ciddiyetli itirazlar "tek"
      kelimesinin sayi anlaminda kullanildigi cumlelerde ("tek bir gunle sinirli
      degildi", "tek bir cephede yurumedigini", "tek nedenli aciklamalarin",
      "tek bir sehirde") tetikleniyor. Bunlar onculuk/ustunluk iddiasi
      tasimiyor.

# Faz 2 turu B12: ortacag-erken modern olay kumesi — 2026-08-21
  - bulgu: >-
      Curutucu, olay-hacli-seferleri'nde "tamamen" ifadesini atif cercevesi
      olmadan kullanilmis kesinlik dili saydi; ayni makalede ve olay-reform'da
      nedensellik iddialarinin tek kaynaga dayandigini isaretledi.
    aksiyon: >-
      Uc cumle de "kaynagin kaydina gore", "ayni kayda gore", "savasi anlatan
      kaynaga gore" ile acikca kaynaga atfedildi. Iki tek-kaynakli-nedensellik
      itirazi bu duzeltmeden sonra da tetikleniyor, cunku dedektor cumledeki
      referans SAYISINA bakiyor; bunlar dosyanin basindaki genel
      "tek-kaynakli-nedensellik / gerekcelendirildi" karari kapsamindadir:
      iddia "X oldugu icin Y oldu" degil, "K kaynagi sunu soyluyor"dur.
  - tip: ustunluk-iddiasi
    kapsam: "faz-2 B12 kumesi"
    karar: yanlis-pozitif
    gerekce: >-
      Onceki turlarla ayni: "tek bir ogretinin", "tek renkli", "tek dogrudan
      karsilasma" gibi sayi anlaminda kullanilan ifadeler tetikliyor.

# Faz 2 turu B13: Atlantik devrimleri kumesi — 2026-08-21
  - bulgu: >-
      Curutucu, olay-fransiz-devrimi ve olay-1848-devrimleri'nde bes ayri
      nedensellik cumlesini tek kaynaga dayandigi icin isaretledi.
    aksiyon: >-
      Bes cumle de "kaynagin kaydina gore", "ayni kayda gore", "kaynaga gore",
      "kaynagin aktardigi bicimiyle" ile acikca kaynaga atfedildi. Kalan
      isaretler dosyanin basindaki genel tek-kaynakli-nedensellik karari
      kapsamindadir: bunlar bagimsiz nedensellik iddialari degil, referans
      eserin KENDI nedensellik anlatiminin aktarimidir.
  - bulgu: >-
      olay-1848-devrimleri yazilirken makale once `tartismali` isaretlenmis ve
      KAPI 9'u gecmek icin `::tartismali` yonergesi ILGISIZ bir haritaya
      (tartisma-romanin-cokus-nedeni) baglanmisti.
    aksiyon: >-
      Bag kaldirildi. Bu, Faz 0'da bir kez yasanan "kapiyi susturmak icin
      yanlis bag kurma" hatasinin tekrariydi ve uretici oturum tarafindan
      yakalandi. Dogru cozum: makalenin olgusal tabani `yaygin`dir; tartismali
      olan sey yorumdur ve iki yorum da kaynagin kendi ifadeleriyle, hakemlik
      yapilmadan metinde yan yana verilmistir. Kapi gevsetilmedi, etiket
      duzeltildi.

# Faz 2 turu B14: 19. yuzyil Asya kumesi — 2026-08-21
  - bulgu: >-
      Curutucu, olay-taiping-isyani'nda "tamamen" ifadesini YUKSEK ciddiyette
      kesinlik dili saydi; olay-1857-hint-ayaklanmasi'nda bir cumleyi kapsam
      carpitmasi, iki dosyada da nedensellik cumlelerini tek kaynakli olarak
      isaretledi.
    aksiyon: >-
      "tamamen" -> "butunuyle" ve cumle "kaynaga gore" ile atfedildi; kapsam
      itirazina konu olan cumle kaynagin kendi ifadesine baglandi; nedensellik
      cumleleri "kaynagin anlatiminda" / "kullanilan veri kumesine gore"
      cerceveleriyle acikca kaynaga atfedildi.
  - bulgu: >-
      B13'te yakalanan "yanlis haritaya baglama" hatasi B14'te bir kez daha
      tekrar etti: olay-taiping-isyani'ndaki `::tartismali` yonergesi ilk
      yazimda tartisma-imparatorluk-siniri-nasil-cizilir'e baglanmisti.
    aksiyon: >-
      Bunun yerine eksik olan harita yazildi:
      `tartisma-tarihsel-sayilar-nasil-okunur`. Harita, atlasin bilanco
      sayilariyla nasil calistigini dort pozisyonla ele aliyor ve Taiping
      (20-100 milyon), Kavimler Gocu (500.000-1.000.000+), Justinyen vebasi
      (2019 "abartildi" iddiasi) ve Haiti (eksik taraf) ornekleriyle
      dogrulaniyor. Belirsiz bilanco tasiyan uc mevcut dosya bu haritaya
      baglandi. Kural netlesti: `::tartismali` yonergesi KONUYA uygun bir
      haritaya baglanmalidir; uygun harita yoksa harita yazilir.

# Faz 2 turu B15: 20. yuzyil kumesi — 2026-08-21
  - bulgu: >-
      Gecis 2, olay-cin-devrimi-1949'da HATA verdi: Qing hanedaninin 1644-1912
      araligi k1'e (Chinese Communist Revolution) atfedilmisti; sayi o kaynakta
      yok.
    aksiyon: >-
      Qing dynasty maddesi k4 olarak kunyeye eklendi ve cumle ona atfedildi.
      Gecis 2 yeniden calistirildi: TEMIZ. Bu, "yakin bir dosyadan hatirlanan
      bilgiyi eldeki kaynaga atfetme" hatasidir ve denetim hatti yakaladi.
  - bulgu: >-
      Curutucu, olay-hindistan-bolunmesi'nde iki nedensellik cumlesini ve
      olay-cin-devrimi-1949'da bir cumleyi (kuresel dil / bolgesel makale)
      isaretledi.
    aksiyon: >-
      Nedensellik cumleleri "kaynaga gore" / "ayni kayda gore" ile atfedildi;
      kapsam itirazina konu olan cumlede "kuresel" ifadesi "bloklar arasi" ile
      degistirildi — iddia degismedi, kapsam dili makalenin bolge etiketiyle
      uyumlu hale getirildi.

# Faz 2 turu B16: Soguk Savas kriz kumesi — 2026-08-21
  - bulgu: >-
      Curutucu, olay-suveys-krizi'nde bir nedensellik cumlesini tek kaynakli
      olarak isaretledi; olay-bandung-konferansi'nda iki dusuk itiraz "tek"
      kelimesinin sayi anlaminda kullanildigi cumlelerde tetiklendi.
    aksiyon: >-
      Nedensellik cumlesi "kaynagin kaydina gore" ile atfedildi. "tek"
      itirazlari onceki turlardaki gerekceyle yanlis pozitif sayildi ("tek
      basina bir orgut kurmadi", "tek tek konumlari").

# Faz 2 turu B17-B18: kurum ve erken modern hanedan kumeleri — 2026-08-21
  - tip: ustunluk-iddiasi
    kapsam: "faz-2 B17-B18 kumeleri"
    karar: yanlis-pozitif
    gerekce: >-
      Kalan itirazlarin tamami dusuk ciddiyette ve onceki turlarla ayni sekle
      sahip: "tek bir muharebe", "tek renkli", "tek satirlik siniflandirma",
      "ilk hukumdar", "ilk Ispanyol Bourbon'u" gibi ifadeler. Bunlarin bir
      kismi sayi anlaminda, bir kismi da kaynagin KENDI nitelemesi olarak
      ("ilk hukumdari", "en buyuk imparatorluklarindan biri") ve dipnotla
      aktarilmis durumda.

# Faz 2 turu B21: erken modern + 20. yy olay kumesi — 2026-08-21
  - bulgu: >-
      Curutucu, olay-ispanya-ic-savasi'nda iki cumleyi kapsam carpitmasi olarak
      isaretledi: makale `bolge: [avrupa]` etiketliydi ama kaynagin kendisi
      savasi "dunya capinda bir ideolojik savas alani" olarak tanimliyor ve
      taraf listesinde SSCB ile Meksika da yer aliyor.
    aksiyon: >-
      Itiraz HAKLIYDI ve etiket duzeltildi: bolge [avrupa, kuresel, amerika].
      Metin degistirilmedi — degistirilen sey, icerikle uyusmayan ust veriydi.
      Bu, "kapiyi susturmak" degil, kapinin dogru buldugu bir tutarsizligi
      gidermektir.
  - bulgu: >-
      olay-yedi-yil-savasi'nda bir nedensellik cumlesi tek kaynakli olarak
      isaretlendi.
    aksiyon: >-
      Cumle "kaynaga gore" ile atfedildi. Kalan isaret, dosyanin basindaki genel
      tek-kaynakli-nedensellik karari kapsamindadir.

