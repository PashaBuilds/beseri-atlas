# Faz 2 turu B36: Boksor Isyani + Italyan birligi — 2026-08-21
  - bulgu: >-
      Iki makalede de "tek" kelimesi ustunluk-iddiasi olarak isaretlendi:
      "tek bir isyana karsi ittifak" ve "tek bir olay olarak degil".
    aksiyon: >-
      Itiraz REDDEDILDI. Her iki kullanimda "tek" sayi sifatidir (bir adet),
      oncelik ya da ustunluk iddiasi degil. Bu, dosyanin basindaki duragan
      ustunluk-iddiasi karari kapsamindadir; metin degistirilmedi.
