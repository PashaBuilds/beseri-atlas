# GEÇİŞ 4 / §16 ÖRNEKLEME KAPISI — türetici oturumun çıktısı
#
# Her cevap, makalenin kullandığı alan adlarının DIŞINDAN gelmek zorundadır.
# `kaynak_url` alanı orkestratör tarafından yeniden fetch edilir ve değerin o
# sayfada gerçekten bulunup bulunmadığı kontrol edilir — türetici oturumun
# beyanına güvenilmez.
#
# durum_notu: türetilemeyen iddialar için gerekçe. Bunlar "doğrulandı"
# sayılmaz; orandan da düşülmez, ayrıca raporlanır (§16 şeffaflık şartı).
#
# ÖNEMLİ — bu tur (359 makalelik korpus, Faz 5 kapanış turu) örnekleyicinin
# düzeltilmesinden SONRA alınmıştır. Önceki turlarda makale sırası alfabetikti;
# 20'lik bir örnek hiçbir zaman ilk turu aşamadığı için örneğin tamamı
# `aktor-` dosyalarından geliyordu. Sıralama tohumlandı; bu örnek yedi tipe
# yayılıyor (aktor, olay, veri, dusunur, kavram, kaynak, tartisma).
# bkz. plan/faz-notlari.md
#
# Kullanılan bağımsız alan adları:
#   - en.wikisource.org — 1911 Encyclopædia Britannica tam metni (kamu malı).
#     UYARI: 1911 kronolojisi MÖ tarihlerinde ve 1911 sonrası olaylarda
#     kullanılamaz.
#   - iep.utm.edu — Internet Encyclopedia of Philosophy (hakemli).
#   - avalon.law.yale.edu — Avalon Project (Yale), belge tam metinleri.
#   - openlibrary.org — bibliyografik katalog, yayın yılı türetmesi için.
#
# Veri kümesinin kendi iç yapısına dair iddialar (bir serinin ilk gözlem yılı,
# bir dosyada kaç satır olduğu) tanımı gereği başka bir alan adından
# türetilemez: bunlar o sağlayıcının dosyasına ait olgulardır. Bu tür sorular
# türetilemedi olarak işaretlendi; §16'nın şeffaflık şartı gereği sayıları
# raporda ayrıca verilir.

