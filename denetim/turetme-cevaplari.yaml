# GEÇİŞ 4 / §16 ÖRNEKLEME KAPISI — türetici oturumun çıktısı
#
# Her cevap, makalenin kullandığı alan adlarının DIŞINDAN gelmek zorundadır.
# `kaynak_url` alanı orkestratör tarafından yeniden fetch edilir ve değerin o
# sayfada gerçekten bulunup bulunmadığı kontrol edilir — türetici oturumun
# beyanına güvenilmez.
#
# durum_notu: türetilemeyen iddialar için gerekçe. Bunlar "doğrulandı"
# sayılmaz; orandan da düşülmez, ayrıca raporlanır (§16 şeffaflık şartı).
#
# ÖNEMLİ — bu tur 505 makalelik korpus üzerinde alınmıştır (2026-08-28).
# Örnek 30 soruluk ve yedi tipe yayılıyor (aktor, olay, veri, dusunur,
# kavram, kaynak, tartisma). bkz. plan/faz-notlari.md
#
# Kullanılan bağımsız alan adları:
#   - en.wikisource.org — 1911 Encyclopædia Britannica tam metni (kamu malı).
#     UYARI: 1911 kronolojisi MÖ tarihlerinde ve 1911 sonrası olaylarda
#     kullanılamaz.
#   - iep.utm.edu — Internet Encyclopedia of Philosophy (hakemli).
#   - openlibrary.org — bibliyografik katalog (yayın yılı ve yazar
#     doğum/ölüm tarihleri, düz JSON).
#   - encyclopedia.com — lisanslı ansiklopedi içerikleri.
#   - cfr.org — Council on Foreign Relations arka plan/zaman çizelgesi.
#   - afe.easia.columbia.edu — Columbia Üniversitesi Asia for Educators.
#   - courses.washington.edu — Washington Üniversitesi ders sayfası
#     (Demandt 1984 listesinin tam dökümü).
#   - openstax.org — hakemli açık ders kitabı (World History Vol. 1).
#   - hegel.net — Hegel biyografi arşivi.
#   - marxists.org — Marksist İnternet Arşivi sözlüğü (yalnız bloke
#     olmadığı sorularda).
#   - online.norwich.edu — Norwich Üniversitesi kaynak kitaplığı.
#   - abjol.org.et — Abyssinia Journal of Business and Social Sciences
#     (hakemli makale özeti).
#   - doinghistoryinpublic.org — tarihçilerin yürüttüğü kamu tarihi blogu.
#
# Veri kümesinin kendi iç yapısına dair iddialar (bir serinin ilk gözlem yılı,
# sağlayıcının toplam satırındaki ondalıklı değerler) tanımı gereği başka bir
# alan adından türetilemez: bunlar o sağlayıcının dosyasına ait olgulardır.
# Bu tür sorular türetilemedi olarak işaretlendi; §16'nın şeffaflık şartı
# gereği sayıları raporda ayrıca verilir.

