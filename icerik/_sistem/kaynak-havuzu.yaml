# Beşeri Atlas — kaynak havuzu (§8)
#
# `dogrulanabilir: false` işaretli alanlar bot koruması nedeniyle programatik
# olarak fetch edilemez. KAPI 8 ve KAPI 10 bu alanları künyede reddeder.
# Bu bir gevşetme değil sıkılaştırmadır: doğrulanamayan bir künye, doğrulanmış
# gibi görünen bir künyeden daha tehlikelidir (§15 "İlerlemek için kaynak
# uydurmak" yasağı). Bu alanlar araştırma sırasında okunabilir; künyeye
# yazılamaz — okunan bilgi doğrulanabilir bir kaynakla teyit edilip o kaynak
# künyeye girer.
#
# Ölçüm tarihi: 2026-08-20 (araclar/kaynak-canlilik.mjs ile)

surum: 1

whitelist:
  # ─── Genel referans ───────────────────────────────────────────────────────
  - alan: en.wikipedia.org
    tur: ansiklopedi
    dogrulanabilir: true
    kullanim: giris_kapisi
    not: >
      Yalnızca giriş kapısı olarak. Makalenin kendi dipnotundaki asıl kaynağa
      inilir ve künyeye o kaynak yazılır. Tek başına kaynak gösterilemez —
      her makalede en fazla bir Wikipedia künyesi bulunabilir.
  - alan: islamansiklopedisi.org.tr
    tur: ansiklopedi
    dogrulanabilir: true
    kullanim: birincil_tercih
    kapsam: [osmanli, islam-dunyasi, turkiye]
  - alan: britannica.com
    tur: ansiklopedi
    dogrulanabilir: false
    engel: HTTP 403 — bot koruması, User-Agent değişimiyle de aşılamıyor
  - alan: iranicaonline.org
    tur: ansiklopedi
    dogrulanabilir: false
    engel: HTTP 403 — bot koruması

  # ─── Akademik / hakemli ───────────────────────────────────────────────────
  - alan: plato.stanford.edu
    tur: akademik
    dogrulanabilir: true
    kullanim: birincil_tercih
    kapsam: [felsefe]
    not: Aralıklı bağlantı zaman aşımı verebilir; getir.mjs 3 deneme yapar.
  - alan: iep.utm.edu
    tur: akademik
    dogrulanabilir: true
    kapsam: [felsefe]
  - alan: dergipark.org.tr
    tur: akademik
    dogrulanabilir: true
    kapsam: [turkce-akademik]
  - alan: jstor.org
    tur: akademik
    dogrulanabilir: true
    kullanim: sadece_acik_erisim
    not: Yalnızca açık erişim koleksiyonu. Paywall arkasındaki metin künyeye yazılmaz.
  - alan: ssrn.com
    tur: akademik
    dogrulanabilir: false
    not: >
      2026-08-29 olcumu: ssrn.com ve papers.ssrn.com 403 ve 0 karakter
      donuyor. Kayit onceden `dogrulanabilir: true` yaziyordu; olcum bunu
      yalanladi ve kayit duzeltildi. SSRN on baskilarina api.crossref.org
      uzerinden erisilebilir (kayitlarin bir bolumunde `abstract` alani
      DOLUDUR).
  - alan: arxiv.org
    tur: akademik
    dogrulanabilir: true
    kapsam: [ekonomi, kwantitatif-tarih]

  # ─── Batı-dışı birincil metinler (kamu malı) ──────────────────────────────
  # 2026-08-23'te eklendi. Gerekçe ölçümdür: birincil metni bulunamayan dört
  # eserin dördü de Batı-dışıydı (İbn Haldûn, Sima Qian, Fârâbî, Kautilya);
  # Batı kanonundan bulunamayan tek eser yoktu. Boşluk korpusun değil,
  # kullanılan arşivlerin kapsamındaydı.
  - alan: en.wikisource.org
    tur: birincil
    dogrulanabilir: true
    kapsam: [antlasma-metinleri, anayasa-metinleri, ingilizce-klasikler]
    not: >
      Antlasma ve anayasa metinlerinin transkripsiyonlari icin. Kunyeye
      yazilmadan once sayfanin ilgili metni gercekten icerdigi dogrulanir;
      ayni baslikta ozet veya tartisma sayfasi bulunabilir.
  - alan: waitangitribunal.govt.nz
    tur: akademik
    dogrulanabilir: true
    kapsam: [yeni-zelanda, waitangi]
    not: >
      Antlasma iddialarini inceleyen resmi kurul. Taraf konumundadir;
      raporlari kurulun kendi degerlendirmesi olarak kunyelenir.
  - alan: ar.wikisource.org
    tur: birincil
    dogrulanabilir: true
    kapsam: [arapca-klasikler]
  - alan: zh.wikisource.org
    tur: birincil
    dogrulanabilir: true
    kapsam: [cin-klasikleri]
  - alan: shamela.ws
    tur: birincil
    dogrulanabilir: true
    kapsam: [arapca-klasikler]
    not: el-Mektebetü'ş-şâmile. Erişilebilir; eser bazında doğrulama gerekir.
  - alan: sacred-texts.com
    tur: birincil
    dogrulanabilir: false
    engel: HTTP 403 — bot koruması
  - alan: al-maktaba.org
    tur: birincil
    dogrulanabilir: false
    engel: HTTP 403 — bot koruması
  # ─── Birincil metinler (kamu malı) ────────────────────────────────────────
  - alan: gutenberg.org
    tur: birincil
    dogrulanabilir: true
  - alan: archive.org
    tur: birincil
    dogrulanabilir: true
    # BIREBIR DOGRULAMA SINIRI (2026-08-29 ajan olcumu): getir.mjs metni
    # 400k karakterde keser. 400k'yi asan ciltlerde dogrulama dizesi
    # sinirin otesinde kalabilir ve kunye yalnizca "kelime ortusmesi %100"
    # ile gecer — bu BIREBIR dogrulama DEGILDIR. Ornek: Chadwick'in 1842
    # Sanitary Report'u (b21307313) 1.257.494 karakter; dok.mjs --tam ile
    # okunabiliyor ama kapinin gordugu pencerede hedef dizeler yok.
    # Boyle bir cilde yaslanacaksan dogrulama dizesini ILK 400k icinden sec.
  # Muze koleksiyon API'leri. Muzelerin insan arayuzlu sayfalari (britishmuseum.org,
  # metmuseum.org, si.edu, europeana.eu) otomatik istekleri engelliyor — 2026-08-25'te
  # dordu de 403/429 dondurdu. API uc noktalari engellemiyor ve makine okunur
  # kunye (baslik, kultur, tarih, insan sayfasi baglantisi) veriyor.
  - alan: collectionapi.metmuseum.org
    tur: birincil
    dogrulanabilir: true
  - alan: perseus.tufts.edu
    tur: birincil
    dogrulanabilir: true
    kapsam: [klasik-metinler]
  - alan: avalon.law.yale.edu
    tur: birincil
    dogrulanabilir: true
    kapsam: [antlasmalar, hukuki-belgeler]
  - alan: marxists.org
    tur: birincil
    dogrulanabilir: true
    not: Birincil metin arşivi olarak kullanılır; Marksist olmayan metinler dahil.

  # ─── Veri ─────────────────────────────────────────────────────────────────
  - alan: ourworldindata.org
    tur: veri
    dogrulanabilir: true
    lisans: CC-BY
  - alan: who.int
    tur: akademik
    dogrulanabilir: true
    kapsam: [saglik, salgin, modern]
    not: >
      Dunya Saglik Orgutu resmi sayfalari. 2026-08-29 olcumu: iki sayfa
      programatik fetch'te 200 + dogrulanabilir metin dondurdu (ornegin
      asiri-olum tahmini haber sayfasi "14.9 million" dizesini birebir
      tasiyor). Modern saglik/salgin iddialarinin resmi kaynagi olarak
      Wikipedia'ya ustun tercih.
  - alan: un.org
    tur: birincil
    birincil_tur: belge
    dogrulanabilir: true
    kapsam: [kuresel, hukuk, modern]
    not: >
      Birlesmis Milletler resmi sayfalari. 2026-08-29 olcumu:
      /en/about-us/member-states 200 ve 12,2k; /en/about-us/growth-in-un-
      membership 200 ve 8,7k. Temiz metin, bot korumasi yok.
  - alan: treaties.un.org
    tur: birincil
    birincil_tur: belge
    dogrulanabilir: true
    kapsam: [kuresel, hukuk, modern]
    not: >
      BM Antlasma Koleksiyonu. 2026-08-29 olcumu:
      /Pages/HistoricalInfo.aspx 200 ve 358,9k temiz metin. Uyelik ve
      ardillik gecislerinin kurumsal kaydi icin havuzdaki en guclu kanal.
  - alan: unesco.org
    tur: akademik
    dogrulanabilir: true
    kapsam: [kuresel, kultur, kolelik]
    not: >
      UNESCO resmi sayfalari. 2026-08-29 olcumu: 200, 6,2k temiz metin.
      Kolelik yollari (Routes of Enslaved Peoples) gibi kurumsal
      programlarin kendi kaydi. DIKKAT: slavevoyages.org istemci
      tarafinda ciziliyor (16 karakter doner) ve kunyeye YAZILAMAZ;
      kole ticareti sayilari icin havuzdaki tek kurumsal kanal budur.
  - alan: treccani.it
    tur: ansiklopedi
    dogrulanabilir: true
    kapsam: [italya, dil, kultur]
    not: >
      Istituto della Enciclopedia Italiana. Imzali maddeler tasiyan ulusal
      basvuru ansiklopedisi; kaynak hiyerarsisinde Wikipedia'nin ustunde,
      akademik yayinin altinda. 2026-08-29 olcumu: 200, 3,7k temiz metin
      (sayfalar kisadir ama govde gercek icerik tasir, kabuk degil).
      DIKKAT: giris kapisi kuralina TABIDIR — bir makalede Treccani ile
      Wikipedia birlikte kullanilamaz. Italyan dil tarihi ve biyografi
      iddialari icin havuzda baska kanal yoktu.
  - alan: trumanlibrary.gov
    tur: birincil
    birincil_tur: belge
    dogrulanabilir: true
    kapsam: [abd, modern]
    not: >
      NARA baskanlik kutuphanesi; Public Papers of the Presidents tam metni.
      2026-08-29 olcumu: 200, 4,6k ve 16,8k, bot korumasi yok. DIKKAT: slug
      tam eslesme ister; yanlis slug 200 doner ama govde 2055 karakterlik
      BOS KABUKTUR — kunyeye almadan once dize kontrolu sart.
  - alan: history.state.gov
    tur: birincil
    birincil_tur: belge
    dogrulanabilir: true
    kapsam: [abd, diplomasi, modern]
    not: >
      ABD Disisleri Bakanligi Tarihci Ofisi. 2026-08-29 olcumu: 200, temiz
      metin. DIKKAT: "Milestones" dizisi sayfalarinda "has been retired and
      is no longer maintained" notu var; kunye notunda belirtilmeli.
      Calisan yol kalibi: /historicaldocuments/<cilt>/d<N> (FRUS belgeleri).
      /historicaldocuments/<cilt>/comp<N> ve /milestones/1953-1960/... 404.
  - alan: nsarchive2.gwu.edu
    tur: birincil
    birincil_tur: belge
    dogrulanabilir: true
    kapsam: [abd, istihbarat, modern]
    not: >
      George Washington Universitesi Ulusal Guvenlik Arsivi. Gizliligi
      kaldirilmis belge derlemeleri. 2026-08-29 olcumu: EBB sayfalari 200 ve
      temiz metin. Not: nsarchive.gwu.edu (yeni alan) baglanti kurmuyordu;
      nsarchive2 yolu calisiyor. Belgelerin kendisi cogunlukla PDF'tir ve
      dize aranamaz; derlemenin HTML tanitim sayfasi kullanilir.
  - alan: archives.gov
    tur: birincil
    birincil_tur: belge
    dogrulanabilir: true
    kapsam: [abd, modern]
    not: >
      ABD Ulusal Arsivleri. DIKKAT: butun yollar calismiyor. 2026-08-29
      olcumu: /research/military/vietnam-war/casualty-statistics 200 ve
      12,8k temiz metin; baska yollarda 404 alindi. Kullanmadan once yolu
      dok.mjs ile olc.
  - alan: pmc.ncbi.nlm.nih.gov
    tur: akademik
    dogrulanabilir: true
    kapsam: [saglik, tip, modern]
    not: >
      NIH acik erisim deposu (PubMed Central). 2026-08-29 olcumu: makale
      tam metni 200 ve aranabilir. Crossref/Semantic Scholar ozeti yayinci
      tarafindan elenmis makalelerde sayiyi tasiyan tek dogrulanabilir
      metin cogu zaman burasidir.
  - alan: 911memorial.org
    tur: birincil
    birincil_tur: belge
    dogrulanabilir: true
    kapsam: [abd, modern]
    not: >
      11 Eylul Anma Muzesi'nin kendi kaydi. 2026-08-29 olcumu: /in-memoriam
      200, 6,9k metin; hem 2.977 hem 2.983 sayilarini tasiyor (ikincisi 1993
      DTM saldirisinin kurbanlarini da katan ayri bir kapsam).
  - alan: population.un.org
    tur: birincil
    birincil_tur: belge
    dogrulanabilir: true
    kapsam: [demografi, modern, kuresel]
    not: >
      BM Nufus Bolumu. DIKKAT: iki ayri uc nokta var ve yalnizca biri
      kullanilabilir. Insan yuzu (population.un.org/wpp/...) istemci
      tarafinda ciziliyor ve bos doner; VERI PORTALI API'si calisir:
      https://population.un.org/dataportalapi/api/v1/... 2026-08-29
      olcumu: gostergeler uc noktasi 200 ve 98k temiz JSON dondurdu.
      Excel uc noktalari ham ikili doner, dize aramasi yapilamaz.
      World Population Prospects, 20. yuzyil demografisinin birincil
      kaydidir; OWID ayni verinin turevidir.
  - alan: nato.int
    tur: birincil
    birincil_tur: belge
    dogrulanabilir: true
    kapsam: [askeri, modern]
    not: >
      Ittifakin kendi harekat kaydi. 2026-08-29 olcumu: 200, 43k temiz
      metin, bot korumasi yok. DIKKAT: TARAF konumundadir; beyanlari
      taraf beyani olarak kunyelenmeli ve destegi buna gore
      sinirlandirilmalidir.
  - alan: bici.org.bh
    tur: birincil
    birincil_tur: belge
    dogrulanabilir: true
    kapsam: [ortadogu, insan-haklari, modern]
    not: >
      Bahreyn Bagimsiz Sorusturma Komisyonu'nun kendi yayini. 2026-08-29
      olcumu: HTML ana sayfa 200, 4k temiz metin. DIKKAT: PDF uc noktasi
      (/BICIreportEN.pdf) ham ikili doner, dize aramasi yapilamaz — HTML
      sayfasi kullanilmali. Komisyonu devletin kendisi kurmustur;
      bagimsizlik beyani kendi beyanidir.
  - alan: camera.it
    tur: birincil
    dogrulanabilir: false
    kapsam: [italya, hukuk, modern]
    not: >
      Italyan Temsilciler Meclisi. 2026-08-29 olcumu: bot korumasi donuyor
      ("Checking your browser...", 164-167 karakterlik govde). storia.camera.it
      ayni davranista. Kunyeye YAZILAMAZ; dogrulama dizesi tutturulamaz.
      Yerine donemin resmi yayinlari kullanilabilir (1861 nufus sayimi,
      1878 istatistik yilligi; archive.org uzerinde).
  - alan: senato.it
    tur: birincil
    dogrulanabilir: false
    kapsam: [italya, hukuk, modern]
    not: >
      Italyan Senatosu. 2026-08-29 olcumu: HTTP 202 ve bos govde. Kunyeye
      YAZILAMAZ.
  - alan: nobelprize.org
    tur: birincil
    birincil_tur: tanik
    dogrulanabilir: true
    kapsam: [modern, bilim]
    not: >
      Nobel Vakfi'nin kurumsal arsivi; odul sahiplerinin kendi konusma
      metinleri tam olarak burada. 2026-08-29 olcumu: 200, 68k temiz metin,
      bot korumasi yok, JS gerekmiyor. Havuzda esdegeri yok; konusmalarin
      tam metnini tasiyan baska dogrulanabilir alan bulunamadi (savunuculuk
      siteleri kasitli olarak kullanilmadi).
  - alan: api.parliament.uk
    tur: birincil
    birincil_tur: belge
    dogrulanabilir: true
    kapsam: [britanya, hukuk, modern]
    not: >
      Birlesik Krallik Parlamentosu'nun Hansard 1803-2005 resmi tutanak
      dizisi. DIKKAT: ana kapi hansard.parliament.uk 403 veriyor; acik olan
      yol api.parliament.uk/historic-hansard/... 2026-08-29 olcumu: iki
      oturum tutanagi 200 ve temiz metin dondurdu. Meclis konusmalari ve oy
      sayilari icin havuzda esdegeri yok.
  - alan: visualizingcultures.mit.edu
    tur: akademik
    dogrulanabilir: true
    kapsam: [asya, cin, japonya, modern]
    not: >
      MIT Visualizing Cultures — hakemli acik akademik yayin, birimler imzali
      (or. Peter C. Perdue), Creative Commons. 2026-08-29 olcumu: 200, temiz
      HTML.
  - alan: mpra.ub.uni-muenchen.de
    tur: akademik
    dogrulanabilir: true
    kapsam: [iktisat, modern]
    not: >
      Munih LMU'nun RePEc deposu (MPRA). 2026-08-29 olcumu: 200, ozet sayfasi
      temiz metin. Ozet sayfasi kullanilir; PDF'e yaslanan iddia "kismi"dir.
  - alan: germanhistorydocs.org
    tur: birincil
    birincil_tur: belge
    dogrulanabilir: true
    kapsam: [almanya, modern]
    not: >
      German History in Documents and Images (GHDI) — Washington'daki Alman
      Tarih Enstitusu'nun belge koleksiyonu. Birincil metin transkripsiyonlari
      Ingilizce ceviri, kaynak kunyesi ve onerilen atif bicimiyle birlikte.
      2026-08-29 olcumu: alti fetch, hepsi 200, temiz HTML, JS gerekmiyor.
      Havuzda 20. yuzyil Almanya birincil metinleri icin esdegeri yok
      (chronik-der-mauer.de istemci tarafinda ciziliyor ve hangi tarih
      istenirse istensin ayni sayfayi donduruyor; bundesstiftung-
      aufarbeitung.de 403).
      DIKKAT (2026-08-29 hakem notu): alan toptan birincil sayilamaz.
      `image-*` kayitlari FOTOGRAF + EDITOR ALTYAZISIDIR; oradan alinan
      sayi ya da olgu birincil belgeden degil GHDI editorlerinin
      kunyesinden gelir. Boyle bir kayda yaslanan iddia kunye notunda
      acikca belirtilmeli ve destegi en fazla "kismi" olmalidir.
  - alan: bpb.de
    tur: akademik
    dogrulanabilir: true
    kapsam: [almanya, modern, siyaset]
    not: >
      Bundeszentrale fur politische Bildung — Almanya federal siyasi egitim
      kurumu; Deutschland Archiv'de imzali akademik yazilar yayimliyor
      (CC BY-NC-ND). 2026-08-29 olcumu: dort fetch, hepsi 200, 11k-112k metin.
  - alan: api.wellcomecollection.org
    tur: kitap
    dogrulanabilir: true
    kapsam: [saglik, tip, modern]
    not: >
      Wellcome Collection katalog API'si. 2026-08-29 hakem olcumu: 200,
      temiz JSON, bot korumasi yok. DIKKAT: katalog kaydidir — bir eserin
      varligini, basim tarihini ve nereden yeniden basildigini dogrular;
      eserin ICERIGINE dair iddiayi tasimaz. Icerik iddiasi ancak "kismi"
      olabilir. Tip tarihi kunyeleri icin havuzda esdegeri yok.
  - alan: 9-11commission.gov
