    dogrulanabilir: true
    kapsam: [modern, muhendislik, abd]
    not: >
      ABD Ulusal Standartlar ve Teknoloji Enstitusu. Dunya Ticaret Merkezi
      cokme sorusturmasinin (NCST Act 2002 yetkisiyle) tek resmi teknik
