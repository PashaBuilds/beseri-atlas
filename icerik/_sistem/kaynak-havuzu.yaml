  - alan: govinfo.gov
    tur: birincil
    birincil_tur: belge
    dogrulanabilir: true
    kapsam: [hukuk, modern, abd]
    not: >
      ABD Devlet Basimevi'nin resmi yayin sistemi; federal kanunlarin tam
