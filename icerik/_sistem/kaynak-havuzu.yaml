# Beşeri Atlas — kaynak havuzu (§8)
#
# `dogrulanabilir: false` işaretli alanlar bot koruması nedeniyle programatik
# olarak fetch edilemez. KAPI 8 ve KAPI 10 bu alanları künyede reddeder.
# Bu bir gevşetme değil sıkılaştırmadır: doğrulanamayan bir künye, doğrulanmış
# gibi görünen bir künyeden daha tehlikelidir (§15 "İlerlemek için kaynak
# uydurmak" yasağı). Bu alanlar araştırma sırasında okunabilir; künyeye
# yazılamaz — okunan bilgi doğrulanabilir bir kaynakla teyit edilip o kaynak
# künyeye girer.
#
# Ölçüm tarihi: 2026-08-20 (araclar/kaynak-canlilik.mjs ile)

surum: 1

whitelist:
  # ─── Genel referans ───────────────────────────────────────────────────────
  - alan: en.wikipedia.org
    tur: ansiklopedi
    dogrulanabilir: true
    kullanim: giris_kapisi
    not: >
      Yalnızca giriş kapısı olarak. Makalenin kendi dipnotundaki asıl kaynağa
      inilir ve künyeye o kaynak yazılır. Tek başına kaynak gösterilemez —
      her makalede en fazla bir Wikipedia künyesi bulunabilir.
  - alan: islamansiklopedisi.org.tr
    tur: ansiklopedi
    dogrulanabilir: true
    kullanim: birincil_tercih
    kapsam: [osmanli, islam-dunyasi, turkiye]
      # 2026-08-29 ajan olcumu: maddeler 18k-124k temiz metin, hepsi 200.
      # Alan GIRIS KAPISI DEGILDIR, yani birden fazla TDV kunyesi
      # kullanilabilir. AMA maddeler ayri ayri imzalidir ve BIRBIRIYLE
      # CELISEBILIR (bir dosyada Darulilim'in kurulus tarihi iki maddede
      # farkli cikti). Kunyede muellif adi yazilmali ve celiski metne
      # tasinmalidir.
  - alan: britannica.com
    tur: ansiklopedi
    dogrulanabilir: false
    engel: HTTP 403 — bot koruması, User-Agent değişimiyle de aşılamıyor
  - alan: iranicaonline.org
    tur: ansiklopedi
    dogrulanabilir: false
    engel: HTTP 403 — bot koruması

  # ─── Akademik / hakemli ───────────────────────────────────────────────────
  - alan: plato.stanford.edu
    tur: akademik
    dogrulanabilir: true
    kullanim: birincil_tercih
    kapsam: [felsefe]
    not: Aralıklı bağlantı zaman aşımı verebilir; getir.mjs 3 deneme yapar.
    # KAPSAM SINIRI (2026-08-29 olcumu): SEP felsefi konulari isler.
    # Zerdustculuk maddesi YOK (404). Marx maddesinde "accumulation"
    # sozcugu HIC gecmiyor — Marx'in iktisadi kategorileri icin SEP
    # kaynak degildir; oraya yaslanan kunye sus dipnotu olur.
  - alan: iep.utm.edu
    tur: akademik
    dogrulanabilir: true
    kapsam: [felsefe]
    # 2026-08-29 Thukydides ajani olcumu: /thucydid/ -> 404. IEP'te Thukydides
    # maddesi YOK; plato.stanford.edu/entries/thucydides/ de 404 doner. Bir
    # felsefe ansiklopedisinde her konuda madde bulundugu varsayilmamali.
  - alan: dergipark.org.tr
    tur: akademik
    dogrulanabilir: true
    kapsam: [turkce-akademik]
      # 2026-08-29 olcumu: ARAMA yolu (/tr/search?q=...) artik bot
      # dogrulamasi istiyor; 200 donuyor ama govde dogrulama kabugu.
      # Makale bulmak icin kullanilamiyor; elde dogrudan makale URL'si
      # varsa denenebilir.
  - alan: jstor.org
    tur: akademik
    dogrulanabilir: true
    kullanim: sadece_acik_erisim
    not: Yalnızca açık erişim koleksiyonu. Paywall arkasındaki metin künyeye yazılmaz.
  - alan: ssrn.com
    tur: akademik
    dogrulanabilir: false
    not: >
      2026-08-29 olcumu: ssrn.com ve papers.ssrn.com 403 ve 0 karakter
      donuyor. Kayit onceden `dogrulanabilir: true` yaziyordu; olcum bunu
      yalanladi ve kayit duzeltildi. SSRN on baskilarina api.crossref.org
      uzerinden erisilebilir (kayitlarin bir bolumunde `abstract` alani
      DOLUDUR).
  - alan: arxiv.org
    tur: akademik
    dogrulanabilir: true
    kapsam: [ekonomi, kwantitatif-tarih]

  # ─── Batı-dışı birincil metinler (kamu malı) ──────────────────────────────
  # 2026-08-23'te eklendi. Gerekçe ölçümdür: birincil metni bulunamayan dört
  # eserin dördü de Batı-dışıydı (İbn Haldûn, Sima Qian, Fârâbî, Kautilya);
  # Batı kanonundan bulunamayan tek eser yoktu. Boşluk korpusun değil,
  # kullanılan arşivlerin kapsamındaydı.
  - alan: en.wikisource.org
    tur: birincil
    dogrulanabilir: true
    kapsam: [antlasma-metinleri, anayasa-metinleri, ingilizce-klasikler]
    not: >
      Antlasma ve anayasa metinlerinin transkripsiyonlari icin. Kunyeye
      yazilmadan once sayfanin ilgili metni gercekten icerdigi dogrulanir;
      ayni baslikta ozet veya tartisma sayfasi bulunabilir.
    # YAZIM FARKI UYARISI (2026-08-29 olcumu): bazi baskilar Amerikan
    # yazimi kullanir ("division of labor"); Ingiliz yazimiyla ("labour")
    # aranan dize %67 ortusmeyle DUSER. dogrulama_dizesi'ni sayfadan
    # kopyala, hafizadan yazma. Ayrica alt sayfalar calisir, ana sayfalar
    # bos donebilir; bolum alt sayfalari ROMEN rakami kullanir.
  - alan: waitangitribunal.govt.nz
    tur: akademik
    dogrulanabilir: true
    kapsam: [yeni-zelanda, waitangi]
    not: >
      Antlasma iddialarini inceleyen resmi kurul. Taraf konumundadir;
      raporlari kurulun kendi degerlendirmesi olarak kunyelenir.
  - alan: ar.wikisource.org
    tur: birincil
    dogrulanabilir: true
    kapsam: [arapca-klasikler]
      # 2026-08-29 ajan olcumu: Mukaddime 3. cuz 200 ve 377k temiz metin.
      # DIKKAT: dogrulama_dizesi HAREKESIZ bir parca olmali (bolum basligi
      # gibi). getir.mjs artik harekeleri siliyor ve elif/te merbuta/elif
      # maksura varyantlarini katliyor, ama kaynagin yazimi degisken
      # oldugu icin en guvenli dize harekesiz ve kisa olandir.
  - alan: zh.wikisource.org
    tur: birincil
    dogrulanabilir: true
    kapsam: [cin-klasikleri]
  - alan: afe.easia.columbia.edu
    tur: birincil
    birincil_tur: eser
    dogrulanabilir: true
    kapsam: [asya, cin, ceviri, egitim]
    not: >
      Columbia University Asia for Educators birincil kaynak seçkileri.
      Yalnız sayfada açıkça çoğaltma izniyle verilen çeviri parçaları birincil
      metin olarak sayılır; tanıtım ve belge soruları ikincil yorumdur. Ban
      Zhao'nun Admonitions for Women seçkisi 2026-08-30 ölçümünde 200 döndü ve
      kaynak başlığı ile metin parçalarını programatik olarak taşıdı.
  - alan: shamela.ws
    tur: birincil
    dogrulanabilir: true
    kapsam: [arapca-klasikler]
    not: el-Mektebetü'ş-şâmile. Erişilebilir; eser bazında doğrulama gerekir.
  - alan: sacred-texts.com
    tur: birincil
    dogrulanabilir: false
    engel: HTTP 403 — bot koruması
  - alan: al-maktaba.org
    tur: birincil
    dogrulanabilir: false
    engel: HTTP 403 — bot koruması
  # ─── Birincil metinler (kamu malı) ────────────────────────────────────────
  - alan: gutenberg.org
    tur: birincil
    dogrulanabilir: true
    # 2026-08-29 Locke ajani olcumu: pg7370 (Second Treatise) 338.548 karakter.
    # DIKKAT: metin CRLF satir sonu tasiyor; IKI SATIRA YAYILAN bir
    # dogrulama_dizesi fetch'te BULUNAMAZ — dize TEK SATIRDAN secilmeli.
    # pg7142 (Thukydides, Crawley) 1.215.682 karakter: 400k penceresi
    # yalnizca I-III. kitaplari kapsar, IV-VIII sinanamaz.
  - alan: archive.org
    tur: birincil
    dogrulanabilir: true
    # BIREBIR DOGRULAMA SINIRI (2026-08-29 ajan olcumu): getir.mjs metni
    # 400k karakterde keser. 400k'yi asan ciltlerde dogrulama dizesi
    # sinirin otesinde kalabilir ve kunye yalnizca "kelime ortusmesi %100"
    # ile gecer — bu BIREBIR dogrulama DEGILDIR. Ornek: Chadwick'in 1842
    # Sanitary Report'u (b21307313) 1.257.494 karakter; dok.mjs --tam ile
    # okunabiliyor ama kapinin gordugu pencerede hedef dizeler yok.
    # Boyle bir cilde yaslanacaksan dogrulama dizesini ILK 400k icinden sec.
    # ODUNC KISITLI KAYIT TESPITI (2026-08-29 kavram hakemi): bir kaydin
    # metin turevleri kilitli olabilir. /metadata/<identifier> cagirip
    # dosyalarin `private: true` bayragina BAK; hepsi private ise kayit
    # yalnizca KATALOGTUR ve ona yaslanan iddia en cok "kismi" olabilir.
    # ACIK TAM METIN ARAMA YOLU (calisiyor, bot korumasi yok):
    #   /advancedsearch.php?q=title%3A(...)&fl[]=identifier&fl[]=title
    #     &rows=20&output=json
    # Bir oturumda oduncu kisitli Jaspers kaydinin yerine acik tam metinli
    # baska bir kayit bu yolla bulundu.
  # Muze koleksiyon API'leri. Muzelerin insan arayuzlu sayfalari (britishmuseum.org,
  # metmuseum.org, si.edu, europeana.eu) otomatik istekleri engelliyor — 2026-08-25'te
  # dordu de 403/429 dondurdu. API uc noktalari engellemiyor ve makine okunur
  # kunye (baslik, kultur, tarih, insan sayfasi baglantisi) veriyor.
  - alan: collectionapi.metmuseum.org
    tur: birincil
    dogrulanabilir: true
      # 2026-08-29 ajan olcumu: /search ucu, /objects ucunun DONDURMEDIGI
      # alanlarda da eslesiyor (bir ad aramasi nesneyi getiriyor ama nesne
      # JSON'unda o ad hic gecmiyor). dogrulama_dizesi MUTLAKA /objects
      # ciktisindan secilmeli (or. accessionNumber). Islam sanati
      # nesnelerinde culture/period/dynasty alanlari cogu zaman bos; nesne
      # kunyesi genellikle ancak "kismi" destek tasir.
  - alan: perseus.tufts.edu
    tur: birincil
    dogrulanabilir: true
    kapsam: [klasik-metinler]
    # 2026-08-29 Thukydides ajani olcumu: Ingilizce (1999.01.0200) ve Yunanca
    # (1999.01.0199) uclari 200 doner, ~51-59k karakter, bolum bazinda cagrilir
    # (book=N:chapter=M). Politonik Yunanca getir.mjs'ten BOZULMADAN geciyor
    # ('ἀληθεστάτην πρόφασιν' birebir dogrulandi); ceviri farki olcmek icin
    # kullanilabilir. 400k sinirina takilan buyuk ciltlere alternatiftir.
  - alan: avalon.law.yale.edu
    tur: birincil
    dogrulanabilir: true
    kapsam: [antlasmalar, hukuki-belgeler]
      # 2026-08-29 ajan olcumu: Japon-Amerikan diplomasi dizisinde calisan
      # yol kalibi japan00N.asp'dir (japan002.asp = Kanagawa Antlasmasi,
      # 200 ve 6.671 karakter). japan.asp ve japan001.asp 404 doner.
      # Not: en.wikisource.org'da Convention_of_Kanagawa YOK (404).
      # 2026-08-29 Locke ajani olcumu: /17th_century/nc05.asp (Fundamental
      # Constitutions of Carolina) 200 ve 49.820 karakter, bot korumasi yok.
      # UYARI: sayfa sonundaki (1)(2)(3) dipnotlari BELGENIN DEGIL, Thorpe'un
      # 19. yuzyil derlemesinin EDITOR IDDIALARIDIR (metnin butununu Locke'a
      # atfetmek, 96. maddenin ona ait olmadigi aktarimi gibi). Birincil kayit
      # degil ikinci el atiftir; kunyede ve govdede oyle isaretlenmeli.
  - alan: marxists.org
    tur: birincil
    dogrulanabilir: true
    not: Birincil metin arşivi olarak kullanılır; Marksist olmayan metinler dahil.

  # ─── Veri ─────────────────────────────────────────────────────────────────
  - alan: ourworldindata.org
    tur: veri
    dogrulanabilir: true
    lisans: CC-BY
      # 2026-08-29 ajan olcumu: grapher CSV uc noktasi ulke ve zaman
      # suzgeci kabul ediyor: ?csvType=filtered&country=~JPN&time=1600..1870
      # -> 2.114 karakter (tam surum 2,23M ve 400k'da kesiliyor). Suzgecli
      # surumde butun satirlar onbellek penceresinde kalir, yani ulke
      # duzeyindeki iddialar --tam gerektirmeden dogrulanabilir. Tam
      # CSV'lerde World satirlari cogu zaman pencerenin disinda kalir.
  - alan: who.int
    tur: akademik
    dogrulanabilir: true
    kapsam: [saglik, salgin, modern]
    not: >
      Dunya Saglik Orgutu resmi sayfalari. 2026-08-29 olcumu: iki sayfa
      programatik fetch'te 200 + dogrulanabilir metin dondurdu (ornegin
      asiri-olum tahmini haber sayfasi "14.9 million" dizesini birebir
      tasiyor). Modern saglik/salgin iddialarinin resmi kaynagi olarak
      Wikipedia'ya ustun tercih.
  - alan: un.org
    tur: birincil
    birincil_tur: belge
    dogrulanabilir: true
    kapsam: [kuresel, hukuk, modern]
    not: >
      Birlesmis Milletler resmi sayfalari. 2026-08-29 olcumu:
      /en/about-us/member-states 200 ve 12,2k; /en/about-us/growth-in-un-
      membership 200 ve 8,7k. Temiz metin, bot korumasi yok.
    # 2026-08-30 BM Guvenlik Konseyi ajani olcumu:
    # /depts/dhl/resguide/scact_veto_table_en.htm -> 200, 25.422 karakter;
    # 1946'dan bugune HER veto satiri (tarih, tasari sembolu, tutanak,
    # gundem maddesi, veto eden daimi uye). Veto sayilari icin havuzda
    # esdegeri yok. Sayfa kendi cekincesini de tasiyor (1946-2004 verisi
    # A/58/47 III. ekinden; kayitlarin cogu paragraf ya da onerge vetosu).
    # /securitycouncil/content/{voting-system,functions-and-powers,
    # current-members} 200 ve ~14-15k; AMA /content/repertoire/veto ve
    # /content/elected-members 404 — yol adlari TAHMIN EDILEMEZ, once
    # calisan bir sayfadan menu okunmali.
    # research.un.org/en/docs/sc/quick 200 ama 4.642 karakter ve tamami
    # gezinme menusu; veto tablosu ORADA DEGIL.
  - alan: treaties.un.org
    tur: birincil
    birincil_tur: belge
    dogrulanabilir: true
    kapsam: [kuresel, hukuk, modern]
    not: >
      BM Antlasma Koleksiyonu. 2026-08-29 olcumu:
      /Pages/HistoricalInfo.aspx 200 ve 358,9k temiz metin. Uyelik ve
      ardillik gecislerinin kurumsal kaydi icin havuzdaki en guclu kanal.
  - alan: unesco.org
    tur: akademik
    dogrulanabilir: true
    kapsam: [kuresel, kultur, kolelik]
    not: >
      UNESCO resmi sayfalari. 2026-08-29 olcumu: 200, 6,2k temiz metin.
      Kolelik yollari (Routes of Enslaved Peoples) gibi kurumsal
      programlarin kendi kaydi. DIKKAT: slavevoyages.org istemci
      tarafinda ciziliyor (16 karakter doner) ve kunyeye YAZILAMAZ;
      kole ticareti sayilari icin havuzdaki tek kurumsal kanal budur.
  - alan: www.legislation.gov.uk
    tur: birincil
    birincil_tur: belge
    dogrulanabilir: false
    kapsam: [britanya, hukuk]
    not: >
      UK yasa arsivi. IKI AYRI OLCUM, ve ikincisi birincisinin genellemesini
      YALANLIYOR — kayit bilerek ikisini birden tasiyor.

      2026-08-29: Government of India Act 1858 (ukpga/Vict/21-22/106) HTTP 200
      doner ve 4.724 karakter verir, ama govdenin TAMAMI gezinme menusudur;
      yasanin maddeleri sayfada YOK. Bundan "1988 oncesi yasalar bu arsivde
      yalnizca kunye duzeyindedir" diye genellenmisti.

      2026-08-30 (Avam Kamarasi hakemi): O GENELLEME YANLIS. Parliament Act
      1911 (ukpga/Geo5/1-2/13) HTTP 200 ve 14.250 karakter doner ve govde
      GERCEKTEN yasa metnidir ("Money Bill", "Speaker of the House of
      Commons", 1. ve 2. maddelerin tam metni). Sinir yasadan yasaya degisir;
      denemeden karar verilmemeli.

      ASIL TUZAK BASKA VE DAHA AGIR: donen metin YURURLUKTEKI (revize) surumdur,
      yasanin ASLI degil. 1911 sayfasi "in two successive sessions" ve "one year
      has elapsed" yazar; 1911 aslinda "three successive sessions" ve "two years
      have elapsed" yaziyordu — degisiklik 1949 Yasasi'yla geldi. Tarihsel bir
      iddiayi bu sayfaya dayandirmak OLGU HATASI uretir. Yasanin ozgun metni
      icin en.wikisource.org/wiki/Parliament_Act_1911 (200, 10.460 karakter,
      "three successive sessions" birebir gecer).
  - alan: docs.un.org
    tur: birincil
    birincil_tur: belge
    dogrulanabilir: false
    kapsam: [uluslararasi, hukuk]
    not: >
      BM resmi belge goruntuleyicisi (undocs.org da ayni motoru kullanir).
      2026-08-30 olcumu: /en/A/RES/377(V) her iki alanda da HTTP 200 doner
      AMA govde 79 KARAKTERDIR — yalnizca bir dil secici. Belge metni
      JavaScript ile yukleniyor; getir.mjs hicbir sey cikaramaz. Genel
      Kurul karar metinleri bu kanaldan ALINAMAZ. Eski uc
      un.org/en/ga/search/view_doc.asp da 403 doner. Calisan yol: kararin
      metnini tasiyan kurumsal sayfa ya da en.wikisource.
  - alan: www.zeno.org
    tur: birincil
    birincil_tur: eser
    dogrulanabilir: true
    kapsam: [almanca, felsefe, sosyoloji]
    not: >
      Almanca kamu mali metin arsivi; Weber'in asillari burada (Die
      protestantische Ethik, Soziologische Grundbegriffe, Die drei reinen
      Typen der legitimen Herrschaft, Wissenschaft als Beruf).
      2026-08-29 olcumu: http://www.zeno.org/Soziologie/M/Weber,+Max -> 200,
      6.879 karakter, icindekiler tam; bolum sayfalari 200 ve ~1.400 karakter,
      bolum bolum inmek gerekiyor. IKI TUZAK: (1) https CALISMIYOR (durum 0),
      yalnizca http:// ile aciliyor; (2) karakter kodlamasi bozuk donuyor,
      umlautlar U+FFFD oluyor — dogrulama_dizesi mutlaka ASCII harflerden
      secilmeli. Ceviri tartismalari (or. "stahlhartes Gehause" / "demir
      kafes") icin asil metne bakmayi mumkun kilan tek acik kanal.
  - alan: es.wikisource.org
    tur: birincil
    birincil_tur: eser
    dogrulanabilir: true
    kapsam: [latin-amerika, ispanyolca, modern]
    not: >
      Ispanyolca Vikikaynak. 2026-08-29 olcumu: Carta de Jamaica sayfasi
      200 ve 100.793 temiz karakter, JS gerekmiyor, bot korumasi yok;
      sayfa metnin IKI kopyasini tasiyor (transkripsiyon + "autentica").
      Latin Amerika bagimsizligi metinleri icin en/ar/zh wikisource
      karsiliklarinin bulunmadigi yerde calisan tek kanal.
  - alan: journals.openedition.org
    tur: akademik
    dogrulanabilir: false
    kapsam: [fransizca, akademik]
    not: >
      OpenEdition Journals. 2026-08-29 olcumu: HTTP 200 doner ama govde
      yalnizca 492 karakterlik Anubis bot filtresi sayfasidir ("This site
      uses Anubis, a tool which filters out harmful bots"). Acik erisim
      olmasina ragmen programatik dogrulama YAPILAMAZ. Ayni makalenin
      api.crossref.org kaydi denenmeli; oradaki `abstract` alani cogu
      zaman dolu.
  - alan: ctext.org
    tur: birincil
    birincil_tur: eser
    dogrulanabilir: false
    kapsam: [cin, klasik]
    not: >
      Chinese Text Project. Klasik Cince metinlerin en genis acik
      derlemesi ama 2026-08-29 olcumu: bot dogrulamasi donuyor
      ("Please confirm that you are human", 1.208 karakter). Kunyeye
      YAZILAMAZ. Klasik Cince birincil metinler icin havuzda su an
      calisan kanal yok; zh.wikisource.org bazi metinleri tasiyor
      (Han shu ornegi dogrulandi) ve once orasi denenmeli.
  - alan: treccani.it
    tur: ansiklopedi
    dogrulanabilir: true
    kapsam: [italya, dil, kultur]
    not: >
      Istituto della Enciclopedia Italiana. Imzali maddeler tasiyan ulusal
      basvuru ansiklopedisi; kaynak hiyerarsisinde Wikipedia'nin ustunde,
      akademik yayinin altinda. 2026-08-29 olcumu: 200, 3,7k temiz metin
      (sayfalar kisadir ama govde gercek icerik tasir, kabuk degil).
      DIKKAT: giris kapisi kuralina TABIDIR — bir makalede Treccani ile
      Wikipedia birlikte kullanilamaz. Italyan dil tarihi ve biyografi
      iddialari icin havuzda baska kanal yoktu.
  - alan: trumanlibrary.gov
    tur: birincil
    birincil_tur: belge
    dogrulanabilir: true
    kapsam: [abd, modern]
    not: >
      NARA baskanlik kutuphanesi; Public Papers of the Presidents tam metni.
      2026-08-29 olcumu: 200, 4,6k ve 16,8k, bot korumasi yok. DIKKAT: slug
      tam eslesme ister; yanlis slug 200 doner ama govde 2055 karakterlik
      BOS KABUKTUR — kunyeye almadan once dize kontrolu sart.
  - alan: history.state.gov
    tur: birincil
    birincil_tur: belge
    dogrulanabilir: true
    kapsam: [abd, diplomasi, modern]
    not: >
      ABD Disisleri Bakanligi Tarihci Ofisi. 2026-08-29 olcumu: 200, temiz
