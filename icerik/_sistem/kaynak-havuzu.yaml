  - alan: unictr.irmct.org
    tur: birincil
    dogrulanabilir: true
    kapsam: [hukuk, modern]
    not: >
      BM/IRMCT resmi ICTR arsivi. 2026-08-29 hakem olcumu: 200. Kalici BM
      mekanizmasi altinda; kirilma riski dusuk.
  - alan: encyclopedia.ushmm.org
    tur: ansiklopedi
    dogrulanabilir: true
    kapsam: [soykirim, modern]
    not: >
      ABD Holokost Anma Muzesi ansiklopedisi. 2026-08-29 hakem olcumu:
