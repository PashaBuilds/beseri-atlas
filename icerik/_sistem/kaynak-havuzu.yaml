# Beşeri Atlas — kaynak havuzu (§8)
#
# `dogrulanabilir: false` işaretli alanlar bot koruması nedeniyle programatik
# olarak fetch edilemez. KAPI 8 ve KAPI 10 bu alanları künyede reddeder.
# Bu bir gevşetme değil sıkılaştırmadır: doğrulanamayan bir künye, doğrulanmış
# gibi görünen bir künyeden daha tehlikelidir (§15 "İlerlemek için kaynak
# uydurmak" yasağı). Bu alanlar araştırma sırasında okunabilir; künyeye
# yazılamaz — okunan bilgi doğrulanabilir bir kaynakla teyit edilip o kaynak
# künyeye girer.
#
# Ölçüm tarihi: 2026-08-20 (araclar/kaynak-canlilik.mjs ile)

surum: 1

whitelist:
  # ─── Genel referans ───────────────────────────────────────────────────────
  - alan: en.wikipedia.org
    tur: ansiklopedi
    dogrulanabilir: true
    kullanim: giris_kapisi
    not: >
      Yalnızca giriş kapısı olarak. Makalenin kendi dipnotundaki asıl kaynağa
      inilir ve künyeye o kaynak yazılır. Tek başına kaynak gösterilemez —
      her makalede en fazla bir Wikipedia künyesi bulunabilir.
  - alan: islamansiklopedisi.org.tr
    tur: ansiklopedi
    dogrulanabilir: true
    kullanim: birincil_tercih
    kapsam: [osmanli, islam-dunyasi, turkiye]
  - alan: britannica.com
    tur: ansiklopedi
    dogrulanabilir: false
    engel: HTTP 403 — bot koruması, User-Agent değişimiyle de aşılamıyor
  - alan: iranicaonline.org
    tur: ansiklopedi
    dogrulanabilir: false
    engel: HTTP 403 — bot koruması

  # ─── Akademik / hakemli ───────────────────────────────────────────────────
  - alan: plato.stanford.edu
    tur: akademik
    dogrulanabilir: true
    kullanim: birincil_tercih
    kapsam: [felsefe]
    not: Aralıklı bağlantı zaman aşımı verebilir; getir.mjs 3 deneme yapar.
  - alan: iep.utm.edu
    tur: akademik
    dogrulanabilir: true
    kapsam: [felsefe]
  - alan: dergipark.org.tr
    tur: akademik
    dogrulanabilir: true
    kapsam: [turkce-akademik]
  - alan: jstor.org
    tur: akademik
    dogrulanabilir: true
    kullanim: sadece_acik_erisim
    not: Yalnızca açık erişim koleksiyonu. Paywall arkasındaki metin künyeye yazılmaz.
  - alan: ssrn.com
    tur: akademik
    dogrulanabilir: true
  - alan: arxiv.org
    tur: akademik
    dogrulanabilir: true
    kapsam: [ekonomi, kwantitatif-tarih]

  # ─── Batı-dışı birincil metinler (kamu malı) ──────────────────────────────
  # 2026-08-23'te eklendi. Gerekçe ölçümdür: birincil metni bulunamayan dört
  # eserin dördü de Batı-dışıydı (İbn Haldûn, Sima Qian, Fârâbî, Kautilya);
  # Batı kanonundan bulunamayan tek eser yoktu. Boşluk korpusun değil,
  # kullanılan arşivlerin kapsamındaydı.
  - alan: en.wikisource.org
    tur: birincil
    dogrulanabilir: true
    kapsam: [antlasma-metinleri, anayasa-metinleri, ingilizce-klasikler]
    not: >
      Antlasma ve anayasa metinlerinin transkripsiyonlari icin. Kunyeye
      yazilmadan once sayfanin ilgili metni gercekten icerdigi dogrulanir;
      ayni baslikta ozet veya tartisma sayfasi bulunabilir.
  - alan: waitangitribunal.govt.nz
    tur: akademik
    dogrulanabilir: true
    kapsam: [yeni-zelanda, waitangi]
    not: >
      Antlasma iddialarini inceleyen resmi kurul. Taraf konumundadir;
      raporlari kurulun kendi degerlendirmesi olarak kunyelenir.
  - alan: ar.wikisource.org
    tur: birincil
    dogrulanabilir: true
    kapsam: [arapca-klasikler]
  - alan: zh.wikisource.org
    tur: birincil
    dogrulanabilir: true
    kapsam: [cin-klasikleri]
  - alan: shamela.ws
    tur: birincil
    dogrulanabilir: true
    kapsam: [arapca-klasikler]
    not: el-Mektebetü'ş-şâmile. Erişilebilir; eser bazında doğrulama gerekir.
  - alan: sacred-texts.com
    tur: birincil
    dogrulanabilir: false
    engel: HTTP 403 — bot koruması
  - alan: al-maktaba.org
    tur: birincil
    dogrulanabilir: false
    engel: HTTP 403 — bot koruması
  # ─── Birincil metinler (kamu malı) ────────────────────────────────────────
  - alan: gutenberg.org
    tur: birincil
    dogrulanabilir: true
  - alan: archive.org
    tur: birincil
    dogrulanabilir: true
  # Muze koleksiyon API'leri. Muzelerin insan arayuzlu sayfalari (britishmuseum.org,
  # metmuseum.org, si.edu, europeana.eu) otomatik istekleri engelliyor — 2026-08-25'te
  # dordu de 403/429 dondurdu. API uc noktalari engellemiyor ve makine okunur
  # kunye (baslik, kultur, tarih, insan sayfasi baglantisi) veriyor.
  - alan: collectionapi.metmuseum.org
    tur: birincil
    dogrulanabilir: true
  - alan: perseus.tufts.edu
    tur: birincil
    dogrulanabilir: true
    kapsam: [klasik-metinler]
  - alan: avalon.law.yale.edu
    tur: birincil
    dogrulanabilir: true
    kapsam: [antlasmalar, hukuki-belgeler]
  - alan: marxists.org
    tur: birincil
    dogrulanabilir: true
    not: Birincil metin arşivi olarak kullanılır; Marksist olmayan metinler dahil.

  # ─── Veri ─────────────────────────────────────────────────────────────────
  - alan: ourworldindata.org
    tur: veri
    dogrulanabilir: true
    lisans: CC-BY
  - alan: who.int
    tur: akademik
    dogrulanabilir: true
    kapsam: [saglik, salgin, modern]
    not: >
      Dunya Saglik Orgutu resmi sayfalari. 2026-08-29 olcumu: iki sayfa
      programatik fetch'te 200 + dogrulanabilir metin dondurdu (ornegin
      asiri-olum tahmini haber sayfasi "14.9 million" dizesini birebir
      tasiyor). Modern saglik/salgin iddialarinin resmi kaynagi olarak
      Wikipedia'ya ustun tercih.
  - alan: nobelprize.org
    tur: birincil
    birincil_tur: tanik
    dogrulanabilir: true
    kapsam: [modern, bilim]
    not: >
      Nobel Vakfi'nin kurumsal arsivi; odul sahiplerinin kendi konusma
      metinleri tam olarak burada. 2026-08-29 olcumu: 200, 68k temiz metin,
      bot korumasi yok, JS gerekmiyor. Havuzda esdegeri yok; konusmalarin
      tam metnini tasiyan baska dogrulanabilir alan bulunamadi (savunuculuk
      siteleri kasitli olarak kullanilmadi).
  - alan: api.parliament.uk
    tur: birincil
    birincil_tur: belge
    dogrulanabilir: true
    kapsam: [britanya, hukuk, modern]
    not: >
      Birlesik Krallik Parlamentosu'nun Hansard 1803-2005 resmi tutanak
      dizisi. DIKKAT: ana kapi hansard.parliament.uk 403 veriyor; acik olan
      yol api.parliament.uk/historic-hansard/... 2026-08-29 olcumu: iki
      oturum tutanagi 200 ve temiz metin dondurdu. Meclis konusmalari ve oy
      sayilari icin havuzda esdegeri yok.
  - alan: visualizingcultures.mit.edu
    tur: akademik
    dogrulanabilir: true
    kapsam: [asya, cin, japonya, modern]
    not: >
      MIT Visualizing Cultures — hakemli acik akademik yayin, birimler imzali
      (or. Peter C. Perdue), Creative Commons. 2026-08-29 olcumu: 200, temiz
      HTML.
  - alan: mpra.ub.uni-muenchen.de
    tur: akademik
    dogrulanabilir: true
    kapsam: [iktisat, modern]
    not: >
      Munih LMU'nun RePEc deposu (MPRA). 2026-08-29 olcumu: 200, ozet sayfasi
      temiz metin. Ozet sayfasi kullanilir; PDF'e yaslanan iddia "kismi"dir.
  - alan: germanhistorydocs.org
    tur: birincil
    birincil_tur: belge
    dogrulanabilir: true
    kapsam: [almanya, modern]
    not: >
      German History in Documents and Images (GHDI) — Washington'daki Alman
      Tarih Enstitusu'nun belge koleksiyonu. Birincil metin transkripsiyonlari
      Ingilizce ceviri, kaynak kunyesi ve onerilen atif bicimiyle birlikte.
      2026-08-29 olcumu: alti fetch, hepsi 200, temiz HTML, JS gerekmiyor.
      Havuzda 20. yuzyil Almanya birincil metinleri icin esdegeri yok
      (chronik-der-mauer.de istemci tarafinda ciziliyor ve hangi tarih
      istenirse istensin ayni sayfayi donduruyor; bundesstiftung-
      aufarbeitung.de 403).
  - alan: bpb.de
    tur: akademik
    dogrulanabilir: true
    kapsam: [almanya, modern, siyaset]
    not: >
      Bundeszentrale fur politische Bildung — Almanya federal siyasi egitim
      kurumu; Deutschland Archiv'de imzali akademik yazilar yayimliyor
      (CC BY-NC-ND). 2026-08-29 olcumu: dort fetch, hepsi 200, 11k-112k metin.
  - alan: api.wellcomecollection.org
    tur: kitap
    dogrulanabilir: true
    kapsam: [saglik, tip, modern]
    not: >
      Wellcome Collection katalog API'si. 2026-08-29 hakem olcumu: 200,
      temiz JSON, bot korumasi yok. DIKKAT: katalog kaydidir — bir eserin
      varligini, basim tarihini ve nereden yeniden basildigini dogrular;
      eserin ICERIGINE dair iddiayi tasimaz. Icerik iddiasi ancak "kismi"
      olabilir. Tip tarihi kunyeleri icin havuzda esdegeri yok.
  - alan: 9-11commission.gov
    tur: birincil
    dogrulanabilir: true
    kapsam: [modern, terorizm, abd]
    not: >
      Ulusal Komisyon'un kendi yayini; 11 Eylul saldirilarinin resmi
      sorusturma raporunun kurumsal barindiricisi. 2026-08-29 olcumu:
      yonetici ozeti 58k, ikinci bolum 67k, temiz HTML, bot korumasi yok.
      Rapor metnini aktaran ikincil sayfalara ustun tercih.
  - alan: nist.gov
    tur: akademik
    dogrulanabilir: true
    kapsam: [modern, muhendislik, abd]
    not: >
      ABD Ulusal Standartlar ve Teknoloji Enstitusu. Dunya Ticaret Merkezi
      cokme sorusturmasinin (NCST Act 2002 yetkisiyle) tek resmi teknik
      kaydi. 2026-08-29 olcumu: 200, 47k metin, JS gerekmiyor.
  - alan: cdc.gov
    tur: akademik
    dogrulanabilir: true
    kapsam: [saglik, modern, abd]
    not: >
      ABD Hastalik Kontrol ve Onleme Merkezleri. 2026-08-29 olcumu: 200,
      13k metin. Toz kaynakli hastalik gibi resmi bilancolara girmeyen
      saglik kayitlarinin kurumsal kaynagi.
  - alan: govinfo.gov
    tur: birincil
    birincil_tur: belge
    dogrulanabilir: true
    kapsam: [hukuk, modern, abd]
    not: >
      ABD Devlet Basimevi'nin resmi yayin sistemi; federal kanunlarin tam
      metni. 2026-08-29 olcumu: Pub. L. 107-40 2,7k · 107-56 379k ·
      107-71 149k · 107-296 400k penceresinde kesiliyor.
      DIKKAT: PDF uc noktalari (/content/pkg/.../pdf/...) getir.mjs'te ham
      ikili doner ve dize aramasi yapilamaz; HTML uc noktasi
      (/content/pkg/.../html/....htm) kullanilmalidir.
  - alan: legal.un.org
    tur: akademik
    dogrulanabilir: true
    kapsam: [hukuk, modern]
    not: >
      BM Uluslararasi Hukuk Gorsel-Isitsel Kutuphanesi. 2026-08-29 hakem
      olcumu: taze fetch 200, 32k metin. Sozlesme muzakere tarihcesi ve
      imzali uzman notlari icin havuzda esdegeri yok.
  - alan: icj-cij.org
    tur: birincil
    dogrulanabilir: true
    kapsam: [hukuk, modern]
    not: >
      Uluslararasi Adalet Divani resmi dava kayitlari. 2026-08-29 hakem
      olcumu: 200, 46k. Uluslararasi mahkeme kararlari icin esdeger yok.
  - alan: unictr.irmct.org
    tur: birincil
    dogrulanabilir: true
    kapsam: [hukuk, modern]
    not: >
      BM/IRMCT resmi ICTR arsivi. 2026-08-29 hakem olcumu: 200. Kalici BM
      mekanizmasi altinda; kirilma riski dusuk.
  - alan: encyclopedia.ushmm.org
    tur: ansiklopedi
    dogrulanabilir: true
    kapsam: [soykirim, modern]
    not: >
      ABD Holokost Anma Muzesi ansiklopedisi. 2026-08-29 hakem olcumu:
      200, temiz HTML. Soykirim/Holokost basliklarinda kurumsal referans.
  - alan: lwl.org
    tur: birincil
    dogrulanabilir: true
    kapsam: [erken-modern, avrupa]
    not: >
      LWL Westfaelische Geschichte (kamu kurumu). Osnabrueck antlasmasi
      (IPO) tam metni; Avalon yalniz IPM'yi tasiyor, wikisource'ta IPO yok.
      2026-08-29 hakem olcumu: iki taze fetch, ikisi de 200, 216k, dizeler
      kararli.
  - alan: eh.net
    tur: akademik
    dogrulanabilir: true
    kapsam: [iktisat-tarihi]
    not: >
      Economic History Association'in acik ansiklopedisi. 2026-08-29 hakem
      olcumu: 200, 58k, JS gerektirmiyor. Iktisat tarihi basliklarinda
      hakem-gormus ikincil kaynak.
  - alan: api.crossref.org
    tur: akademik
    dogrulanabilir: true
    kapsam: [ustveri]
    not: >
      Bibliyografik ustveri kaydi (JSON). 2026-08-29 hakem olcumu: 4 fetch,
      hepsi 200, bot korumasi yok. SINIR: yalniz yazar/yil/baslik/cilt
      iddialarina dogrudan destek olur; icerik iddialarina en cok OZET
      duzeyinde kismi (abstract alani her kayitta yok).
  - alan: api.semanticscholar.org
    tur: akademik
    dogrulanabilir: true
    kapsam: [ustveri]
    not: >
      Bibliyografik ustveri + ozet (JSON). 2026-08-29 hakem olcumu: 3 fetch
      200; anahtarsiz katman paylasimli hiz sinirina tabi, 429 gorulurse
      2-3 sn bekleyip yeniden dene. Ayni ustveri-siniri kurali gecerli.
  - alan: population.un.org
    tur: veri
    dogrulanabilir: false
    engel: >-
      Sayfa istemci tarafında çiziliyor; sunucudan dönen gövdede doğrulanabilir
      metin yok (2026-08-20 ölçümünde 53 karakter). Araştırmada okunabilir,
      künyede kullanılamaz — verinin künyesi için OWID metadata uç noktası tercih edilir.
  - alan: rug.nl
    tur: veri
    dogrulanabilir: true
    kapsam: [maddison-project]
  - alan: correlatesofwar.org
    tur: veri
    dogrulanabilir: true
    kapsam: [catisma-verisi]
  - alan: data.worldbank.org
    tur: veri
    dogrulanabilir: true
  - alan: clio-infra.eu
    tur: veri
    dogrulanabilir: true

  # ─── Ders / anlatı ────────────────────────────────────────────────────────
  - alan: oyc.yale.edu
    tur: ders
    dogrulanabilir: true
  - alan: ocw.mit.edu
    tur: ders
    dogrulanabilir: true

blacklist:
  - alan: medium.com
    gerekce: blog platformu
  - alan: reddit.com
    gerekce: forum
  - alan: quora.com
    gerekce: forum
  - alan: blogspot.com
    gerekce: blog platformu
  - alan: wordpress.com
    gerekce: blog platformu
  - alan: substack.com
    gerekce: blog platformu
  - alan: youtube.com
    gerekce: kaynak gostermeyen video icerigi
  - alan: pinterest.com
    gerekce: icerik ciftligi
  - alan: tr.wikipedia.org
    gerekce: >
      Bu konularda EN sürümünden belirgin biçimde zayıf ve dipnot yoğunluğu
      düşük (§2 dil politikası). Giriş kapısı olarak bile kullanılmaz.
  - alan: libgen
    gerekce: telifli kitaplarin korsan kopyalari — hicbir kosulda
  - alan: z-lib
    gerekce: telifli kitaplarin korsan kopyalari — hicbir kosulda
  - alan: sci-hub
    gerekce: telifli makalelerin korsan kopyalari
  - alan: historyhit.com
    gerekce: SEO agirlikli tarih sitesi
  - alan: thoughtco.com
    gerekce: icerik ciftligi
  - alan: study.com
    gerekce: icerik ciftligi

# Kaynak çeşitliliği kuralı (Geçiş 4 için zorunlu)
cesitlilik:
  makale_basina_min_alan: 2
  wikipedia_max_kunye: 1
  yeniden_turetme_bloklama: >
    Geçiş 4'te türetici oturuma, orijinal makalenin kullandığı alan adlarının
    tamamı bloke edilerek verilir. En az bir farklı alan adından doğrulama
    zorunludur (§10 Geçiş 4, madde 3).

# 2026-08-26: ctext.org beyaz listeden cikarildi. Gerekce: alan artik
# otomatik isteklere CAPTCHA sayfasi donduruyor. HTTP 200 dondugu icin
# canlilik kapisi geciyor ama sayfada kunye dizesi bulunmadigindan
# KAPI 10 kiriliyor. Etkilenen dokuz dosyanin kunyeleri Project
# Gutenberg ve archive.org uzerindeki acik tam metinlerle degistirildi.
# Ayni durumdaki diger alanlar: sacred-texts.com (403),
# britannica.com (403) — ikisi de beyaz listede ama otomatik
# isteklere kapali; kunyeye alinmiyorlar.
