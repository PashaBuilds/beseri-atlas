# Tartisma dosyalarinda kullanilabilecek 'savunanlar' adlari.
#
# Gerekce: tartisma semasi her pozisyon icin en az bir savunan adi zorunlu
# kiliyor ve hicbir kapi bu alani denetlemiyordu. Bir kisiyi savunmadigi bir
# konuma yerlestirmek atlasin yapabilecegi en agir hatadir; bu kutuk, yeni bir
# ad eklemeyi gorunur ve kasitli bir islem haline getirir.
#
# durum alani:
#   dogrulandi          — kisinin bu POZISYONU savundugu dogrulandi
#   tartismada-dogrulandi — kisinin bu TARTISMANIN icinde oldugu dogrulandi;
#                           hangi pozisyonda oldugu ayrica dogrulanmadi
#   devralinan          — kutuk kurulmadan once yazilmis dosyalardan gelen ad;
#                         hicbir yonu dogrulanmadi, borc defterinde duruyor
#
# Iki dogrulama duzeyi arasindaki fark onemlidir: bir kisinin bir tartismanin
# icinde oldugunu gostermek kolaydir; hangi pozisyonu savundugunu gostermek
# ayri bir istir ve metnin kendisine bakmayi gerektirir.
#
# Yeni ad eklerken: once atfi dogrula, sonra durum: dogrulandi ile ekle.
# Dogrulanamiyorsa kisi adi yerine cizgi/yaklasim adi kullan.

