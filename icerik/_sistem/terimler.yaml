# Beşeri Atlas — kilitli terim sözlüğü
#
# Bu dosya Faz 0'da kilitlenir. 300 makale boyunca terminoloji tutarlılığının
# tek garantisi budur. `yasak_varyantlar` altındaki bir dize gövdede, özette
# veya başlıkta geçerse KAPI 4 build'i kırar.
#
# kullanim değerleri:
#   zorunlu             — Türkçe karşılık kullanılır, varyantları yasaktır
#   orijinal_birakilir  — terim çevrilmez, ilk geçtiğinde parantez içi açıklanır
#   tercih_edilen       — yazım/kısaltma birliği için sabitlenmiştir
#
# Sürüm: 1 (Faz 0'da kilitlendi)
surum: 1
kilit_tarihi: 2026-08-20

terimler:
