# plan/kapsam.yaml — projenin tam iş kapsamı (§3, §4)
#
# Orkestratör bir faz açıldığında bu dosyadan kuyruğu doldurur.
# Boş kuyruk "faz bitti" demek değildir; kuyruk doldurulmamış demektir.

hedefler:
  1: 16   # dönem — kronolojik omurga
  2: 150  # ~100 olay + ~50 aktör
  3: 100  # ~40 düşünür + ~60 kavram
  4: 80   # ~25 tartışma + ~15 veri + ~40 kaynak

