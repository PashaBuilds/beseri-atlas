    rota: cevre-felaketi-kimin-kararidir
    sira: 4
    bolge: [dogu-asya]
    eksen: [demografik, ekonomik, siyasi]
    anlati_bicimi: nedensellik-davasi
    soru: Balık, fabrika atığı ve nörolojik belirtiler arasındaki bağ nasıl kanıtlandı; şirket ve devlet belirsizliği sorumluluğu ertelemek için nasıl kullandı?
    benzersiz_katki: Bilimsel nedenselliğin mahkeme ve tazminat kararına dönüşmesini hasta deneyimi, laboratuvar bulgusu ve kurumsal gecikme üzerinden birlikte gösterir.
