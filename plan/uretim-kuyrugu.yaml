    benzersiz_katki: Felaketi tek bir kötü karara bağlamaz; su bütçesi, tarımsal hedef, bürokratik teşvik ve bölgesel eşitsizlikten oluşan karar zincirini izler.
    birincil_hedef: Sovyet sulama planları, uydu görüntüleri, su akışı serileri ve bölgesel sağlık kayıtları.

