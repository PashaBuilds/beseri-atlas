    benzersiz_katki: Kuraklığı kendiliğinden felaket saymaz; yağış serisini geçim stratejileri, hareket kısıtları ve gıda dağıtımıyla bağlayarak çevresel şok ile toplumsal zarar arasını doldurur.
    birincil_hedef: Yağış serileri, erken uyarı kayıtları, yardım raporları ve pastoralist tanıklıkları.

  - id: olay-aral-golunun-kuculmesi
    baslik: Aral Gölü'nün küçülmesi
    tip: olay
    durum: bekliyor
    rota: cevre-felaketi-kimin-kararidir
    sira: 3
    bolge: [orta-asya]
    eksen: [ekonomik, demografik, siyasi]
    anlati_bicimi: altyapi-karari
