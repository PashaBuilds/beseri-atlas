    benzersiz_katki: Jeolojik işaret ile tarihsel sorumluluğu aynı soru saymaz; ölçülebilir tabaka sinyallerini imparatorluk, enerji ve eşitsizlik açıklamalarından ayırıp yeniden bağlar.
    birincil_hedef: Stratigrafi çalışma grubu kayıtları, çekirdek örnek verileri ve rakip başlangıç tezlerinin özgün makaleleri.

