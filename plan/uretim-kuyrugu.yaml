    baslik: Vakıf külliyesi
    tip: aktor
    durum: bekliyor
    rota: din-gundelik-duzeni-nasil-kurur
    sira: 3
    bolge: [islam-dunyasi, bati-asya, avrupa, afrika]
    eksen: [dini, ekonomik, siyasi, kulturel]
    anlati_bicimi: para-akisi-haritasi
    soru: Bir vakıf cami, okul, aşevi ve su yapısını yüzyıllarca finanse ederken dindarlığı mülk geliri, çalışan emeği ve kentsel hizmetle hangi sözleşme içinde birleştirdi?
    benzersiz_katki: Dini hayır kurumunu yalnız niyet üzerinden anlatmaz; gelir getiren dükkândan ücretli göreve ve bedelsiz hizmete uzanan maddi devri izleyerek sürekliliğin koşullarını gösterir.
    birincil_hedef: Vakfiye metinleri, muhasebe defterleri, personel listeleri, mahkeme uyuşmazlıkları, kira kayıtları ve yapı kitabeleri.

  - id: olay-meksika-yerli-kardeslikleri
    baslik: Sömürge Meksika'sında yerli dinî kardeşlikler
    tip: olay
    durum: bekliyor
    rota: din-gundelik-duzeni-nasil-kurur
    sira: 4
    bolge: [amerika]
    eksen: [dini, ekonomik, kulturel, siyasi]
    anlati_bicimi: yerel-defter-okumasi
    soru: Katolik kardeşlikler yerli topluluklarda sömürge denetiminin aracı mı oldu, yoksa ortak para, tören ve makamlar üzerinden yerel dayanışmayı yeniden kurmanın yolu mu?
    benzersiz_katki: Din değiştirmeyi tek yönlü kabul ya da gizli direniş ikiliğine sıkıştırmaz; aynı kurumun gözetim, itibar, borç, cenaze ve ortak kimlik işlevlerini birlikte tartar.
    birincil_hedef: Kardeşlik hesap defterleri, seçim kayıtları, piskopos ziyaretleri, yerli dilindeki vasiyetler, aziz yortusu giderleri ve dava dosyaları.

  - id: kavram-hac-ekonomisi
    baslik: Hac ekonomisi
    tip: kavram
    durum: bekliyor
    rota: din-gundelik-duzeni-nasil-kurur
    sira: 5
    bolge: [kuresel, islam-dunyasi, guney-asya, avrupa, dogu-asya]
    eksen: [dini, ekonomik, demografik]
    anlati_bicimi: yolculuk-maliyeti
    soru: Kutsal bir yere gitmek ulaşım, konaklama, güvenlik, hediye ve kredi ağları gerektirdiğinde ibadet ile pazar arasındaki sınır nerede başlar ve nerede biter?
    benzersiz_katki: Hac deneyimini yalnız inanç ya da turizm başlığına yerleştirmez; farklı geleneklerde yolculuk maliyeti, aracılık, altyapı ve toplu riskin kurduğu benzer mekanizmaları karşılaştırır.
    birincil_hedef: Hacı günlükleri, yol tarifleri, kervan ve gemi kayıtları, konak ücretleri, pazar vergileri, güvenlik emirleri ve ziyaretçi sayımları.

  - id: tartisma-sekulerlesme-kuresel-mi
    baslik: Sekülerleşme küresel bir süreç mi?
    tip: tartisma
    durum: bekliyor
    rota: din-gundelik-duzeni-nasil-kurur
    sira: 6
    bolge: [kuresel, avrupa, islam-dunyasi, guney-asya, dogu-asya, afrika, amerika]
    eksen: [dini, siyasi, kulturel]
    anlati_bicimi: kavram-siniri-tartismasi
    soru: Modernleşme dini zorunlu olarak kamusal hayattan çeker mi; inanç, kurum üyeliği, devlet hukuku ve gündelik pratik farklı yönlerde değiştiğinde sekülerleşme nasıl ölçülür?
    benzersiz_katki: Avrupa deneyimini evrensel takvim saymaz; dindarlık, kurum gücü, hukuk ve kamusal görünürlük için ayrı göstergeler kurarak zıt görünen bölgesel örnekleri karşılaştırır.
    birincil_hedef: Uzun dönem üyelik ve ibadet verileri, anayasa ve eğitim metinleri, vakıf-kilise kayıtları, anketler ve rakip sekülerleşme tezlerinin özgün çalışmaları.

  # ── Gelecek rota 19: Geçmiş kimin hatırasıdır? ─────────────────────────
  - id: kaynak-florentine-codex
    baslik: Florentine Codex
    tip: kaynak
    durum: bekliyor
    rota: gecmis-kimin-hatirasidir
    sira: 1
    bolge: [amerika]
    eksen: [kulturel, siyasi, dini]
    anlati_bicimi: iki-dilli-sayfa
    soru: Nahuatl anlatılar ile İspanyolca çerçeve aynı sayfada buluştuğunda fetih öncesi dünya kimin sesiyle, hangi sorulara cevap verecek biçimde ve hangi sansür altında kaydedildi?
    benzersiz_katki: Kodeksi saydam bir yerli hafıza deposu ya da yalnız sömürge metni saymaz; dil, resim, sayfa düzeni, derleyici ve konuşmacı arasındaki ortak üretimi görünür kılar.
    birincil_hedef: Sayısallaştırılmış iki dilli ciltler, özgün resimler, Nahuatl çevriyazı, İspanyolca metin ve farklı modern çevirilerin aynı pasajları.

  - id: aktor-bati-afrika-griotlari
    baslik: Batı Afrika griotları
    tip: aktor
    durum: bekliyor
    rota: gecmis-kimin-hatirasidir
    sira: 2
    bolge: [afrika]
    eksen: [kulturel, siyasi]
    anlati_bicimi: performans-karsilastirmasi
    soru: Soy, iktidar ve topluluk geçmişini sözlü olarak taşıyan griotlar anlatıyı her icrada değiştirirken tarihsel sürekliliği hangi ezber, müzik ve toplumsal denetim araçlarıyla korur?
    benzersiz_katki: Sözlü tarihi yazının eksik bir kopyası saymaz; farklı tarihlerde kaydedilmiş aynı anlatıların değişen bölümlerini hata değil, hafızanın işlevini gösteren veri olarak okur.
    birincil_hedef: Aynı destanın farklı yıllardaki ses kayıtları, performans çevriyazıları, soy listeleri, icracı görüşmeleri ve yerel tarih karşılaştırmaları.

  - id: kaynak-maori-whakapapa
    baslik: Māori whakapapa kayıtları
    tip: kaynak
    durum: bekliyor
    rota: gecmis-kimin-hatirasidir
    sira: 3
    bolge: [okyanusya]
    eksen: [kulturel, siyasi, dini]
    anlati_bicimi: soy-ve-yer-haritasi
    soru: Whakapapa soy dizileri insanları yalnız atalara değil toprağa, canlılara ve yükümlülüklere bağladığında bir geçmiş kaydı ile siyasal hak iddiası nasıl aynı biçimde birleşir?
    benzersiz_katki: Soy listesini kronoloji çıkarmaya yarayan ham veri olarak kullanmaz; bilginin kim tarafından, hangi bağlamda ve hangi erişim kuralıyla aktarılmasının anlamın parçası olduğunu öğretir.
    birincil_hedef: İwi tarafından erişime açılmış whakapapa kayıtları, Waitangi Mahkemesi tanıklıkları, sözlü anlatılar, yer adları ve topluluk onaylı arşiv açıklamaları.

  - id: olay-yasukuni-hafizasi
    baslik: Yasukuni hafızası tartışması
    tip: olay
    durum: bekliyor
    rota: gecmis-kimin-hatirasidir
    sira: 4
    bolge: [dogu-asya]
    eksen: [siyasi, dini, kulturel]
    anlati_bicimi: ziyaretin-yankilari
    soru: Bir başbakanın Yasukuni Tapınağı ziyareti Japonya'da yas, din ve yurttaşlık; Çin ve Kore'de ise işgal hafızası olarak neden birbirinden farklı anlamlara gelir?
    benzersiz_katki: Tartışmayı tek bir ulusal bakışla çözmez; tapınak kayıtları, devlet-din hukuku, savaş suçlusu sınıflandırması, aile yası ve diplomatik tepkiyi ayrı katmanlara böler.
    birincil_hedef: Tapınak kayıtları, başbakan açıklamaları, mahkeme kararları, Çin ve Kore diplomatik notaları, savaş mağduru ve aile derneklerinin beyanları.

  - id: kavram-arsiv-sessizligi
    baslik: Arşiv sessizliği
    tip: kavram
    durum: bekliyor
    rota: gecmis-kimin-hatirasidir
    sira: 5
    bolge: [kuresel]
    eksen: [kulturel, siyasi]
    anlati_bicimi: kayip-belge-sorusturmasi
    soru: Bir kişinin ya da topluluğun arşivde görünmemesi yaşamadığı veya etkisiz olduğu anlamına mı gelir; kaydetme, saklama, sınıflandırma ve erişim kararları sessizliği nasıl üretir?
    benzersiz_katki: “Kaynak yok” cümlesini araştırmanın sonu olmaktan çıkarır; sessizliğin olay sırasında, arşiv kurarken, kataloglarken ve tarih yazarken oluşan ayrı mekanizmalarını gösterir.
    birincil_hedef: Arşiv edinim politikaları, katalog değişimleri, imha çizelgeleri, erişim kararları ve alternatif sözlü-nesnel kanıtla yeniden kurulan vaka dosyaları.

  - id: tartisma-anitlar-kaldirilmali-mi
    baslik: Tartışmalı anıtlar kaldırılmalı mı?
    tip: tartisma
    durum: bekliyor
    rota: gecmis-kimin-hatirasidir
    sira: 6
    bolge: [kuresel, amerika, avrupa, afrika, dogu-asya]
    eksen: [siyasi, kulturel]
    anlati_bicimi: karar-secenekleri-matrisi
    soru: Şiddet ve tahakkümle ilişkilendirilen bir anıt yerinde kalmalı, açıklanmalı, taşınmalı, dönüştürülmeli ya da kaldırılmalı mı; her seçenek kimin kaybını görünür kılar?
    benzersiz_katki: Tartışmayı geçmişi silmek ile korumak ikiliğine hapsetmez; kamusal onur, tarihsel kanıt, mağduriyet, bağlamlandırma ve karar süreci için ayrı değerlendirme ölçütleri kurar.
    birincil_hedef: Anıt dikme kararları, kitabeler, belediye tutanakları, protesto ve mağdur topluluk beyanları, müze planları ve farklı kentlerdeki nihai kararlar.

  # ── Gelecek rota 20: Salgın toplumu nasıl değiştirir? ──────────────────
  - id: olay-justinianus-vebasi
    baslik: Justinianus Vebası
    tip: olay
    durum: bekliyor
    rota: salgin-toplumu-nasil-degistirir
    sira: 1
    bolge: [bati-asya, avrupa, afrika]
    eksen: [demografik, siyasi, ekonomik]
    anlati_bicimi: kanit-turleri-catismasi
    soru: Altıncı yüzyıl veba dalgasının nüfus ve imparatorluk üzerindeki etkisi kronikler, mezarlar, polen, sikke ve antik DNA birbirinden farklı ölçekler verdiğinde nasıl tartılmalı?
    benzersiz_katki: Salgını otomatik imparatorluk çöküşü açıklaması yapmaz; anlatı kaynağı, yerel arkeoloji ve biyolojik kanıtın örnekleme sınırlarını aynı iddiada karşılaştırır.
    birincil_hedef: Prokopios ve Süryanice kronikler, toplu mezar genomları, tarihlendirilmiş arkeolojik seriler, polen ve sikke verileri.

  - id: olay-tenochtitlan-cicek-hastaligi
    baslik: Tenochtitlan'da çiçek hastalığı
    tip: olay
    durum: bekliyor
    rota: salgin-toplumu-nasil-degistirir
    sira: 2
    bolge: [amerika]
    eksen: [demografik, askeri, siyasi, kulturel]
    anlati_bicimi: kusatma-icinde-salgin
    soru: 1520'deki çiçek hastalığı Tenochtitlan kuşatmasının sonucunu nasıl etkiledi ve hastalığı tek başına fetih açıklaması yapmak yerli ittifakları ile askerî kararları nasıl görünmez kılar?
    benzersiz_katki: Mikrop determinizmini aşar; hastalık zamanlamasını su, kuşatma, lider kaybı, Tlaxcala ittifakı ve İspanyol silahlarıyla aynı karar kronolojisinde tartar.
    birincil_hedef: Nahuatl ve İspanyol fetih anlatıları, Florentine Codex görselleri, ölüm kayıtları, kuşatma kronolojileri ve güncel paleopatoloji çalışmaları.

  - id: olay-samoa-gribi-1918
    baslik: Samoa'da 1918 gribi
    tip: olay
    durum: bekliyor
    rota: salgin-toplumu-nasil-degistirir
    sira: 3
    bolge: [okyanusya]
    eksen: [demografik, siyasi, kulturel]
    anlati_bicimi: iki-ada-karsilastirmasi
    soru: Aynı salgın Batı Samoa'da yıkıcı ölüme yol açarken Amerikan Samoası'nda neden çok daha sınırlı kaldı; gemi karantinası ve sömürge yönetimi bu farkı nasıl üretti?
    benzersiz_katki: Doğal deney kolaycılığına düşmeden komşu adalardaki liman kararı, haber akışı, idari kapasite ve nüfus yapısını karşılaştırır; hesap verebilirlik tartışmasını yerel hafızaya bağlar.
    birincil_hedef: Liman ve gemi kayıtları, karantina emirleri, nüfus-ölüm çizelgeleri, yönetici yazışmaları, yerel tanıklıklar ve soruşturma belgeleri.

  - id: olay-bombay-veba-onlemleri-1896
    baslik: Bombay veba önlemleri
    tip: olay
    durum: bekliyor
    rota: salgin-toplumu-nasil-degistirir
    sira: 4
    bolge: [guney-asya]
    eksen: [demografik, siyasi, ekonomik, kulturel]
    anlati_bicimi: evden-laboratuvara
    soru: 1896 sonrasında ev arama, hastaneye zorla götürme ve mahalle boşaltma uygulamaları hastalık kontrolünü neden sömürge şiddeti ve güvensizlik deneyimine dönüştürdü?
    benzersiz_katki: Halk direncini bilgisizlik diye açıklamaz; belirsiz bulaş bilgisi, konut koşulu, mahremiyet ihlali, ırksal yönetim ve ticaret baskısını aynı politika çatışmasında toplar.
    birincil_hedef: Veba komitesi raporları, belediye tutanakları, yerel basın, hastane ve ölüm kayıtları, mahalle dilekçeleri ve laboratuvar yazışmaları.

  - id: kavram-epidemiyolojik-gecis
    baslik: Epidemiyolojik geçiş
    tip: kavram
    durum: bekliyor
    rota: salgin-toplumu-nasil-degistirir
    sira: 5
    bolge: [kuresel, afrika, guney-asya, amerika]
    eksen: [demografik, ekonomik, siyasi]
    anlati_bicimi: model-ve-aykiri-vaka
    soru: Toplumlar bulaşıcı hastalıktan kronik hastalığa doğru tek yönlü bir geçiş mi yaşar; ikisinin aynı anda yüksek olduğu ülkeler ve geri dönen salgınlar modeli nasıl değiştirir?
    benzersiz_katki: Demografik modeli evrensel basamaklar dizisi olarak ezberletmez; ölüm nedeni sınıflandırması, yaş yapısı, eşitsizlik ve çift hastalık yükü üzerinden modelin kullanım sınırlarını öğretir.
    birincil_hedef: Özgün geçiş makalesi, uzun dönem ölüm nedeni serileri, yaşa göre ölüm tabloları, hastalık sınıflandırma değişimleri ve aykırı ülke verileri.

  - id: tartisma-salginlar-esitsizlik-uretir-mi
    baslik: Salgınlar eşitsizlik üretir mi?
    tip: tartisma
    durum: bekliyor
    rota: salgin-toplumu-nasil-degistirir
    sira: 6
    bolge: [kuresel, bati-asya, amerika, okyanusya, guney-asya]
    eksen: [demografik, ekonomik, siyasi]
    anlati_bicimi: mekanizma-karsilastirmasi
    soru: Büyük salgınlar mevcut eşitsizlikleri yalnız açığa mı çıkarır, yoksa emek kıtlığı, miras, borç, eğitim kaybı ve sağlık politikası üzerinden dağılımı kalıcı biçimde değiştirir mi?
    benzersiz_katki: “Herkesi eşit etkiler” ile “yalnız yoksulları etkiler” genellemelerini aşar; kısa ve uzun vadede gelir, servet, yaşam süresi ve siyasal güç için ayrı mekanizmalar kurar.
    birincil_hedef: Hane ve ölüm kayıtları, ücret-sermaye serileri, vergi ve miras belgeleri, okul kapanma verileri, politika kararları ve rakip nedensel çalışmalar.
