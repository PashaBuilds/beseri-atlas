    bolge: [kuresel, amerika, afrika, okyanusya]
    eksen: [siyasi, ekonomik, demografik]
    anlati_bicimi: kavramdan-olcume
    soru: Çevresel zararın miktarı kadar kimlere yüklendiğini sormak politika değerlendirmesini nasıl değiştirir ve adalet hangi ölçütlerle ölçülebilir?
    benzersiz_katki: Kavramı bir slogan olarak bırakmaz; dağıtım, karar sürecine katılım, tanınma ve onarım boyutlarını tarihsel vakalarda ayrı ayrı sınar.
    birincil_hedef: Çevre adaleti hareketi bildirileri, dava dosyaları, mekânsal maruziyet verileri ve politika metinleri.

